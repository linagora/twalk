[package]
name = "twalk-test-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared integration-test harness for Twalk components: the test stack's lifecycle, the bus, contract validation, and a stub OpenAI-compatible LLM."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-nats = "0.50"
futures = "0.3"
jsonschema = "0.56"
# Moved out of dev-dependencies by #171: `stack.rs` itself now asks the test
# Synapse whether it has loaded the appservice registration, so the harness
# fails with a diagnosis instead of letting a suite discover an unregistered
# appservice as a failed assertion about the code under test.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
