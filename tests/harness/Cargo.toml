[package]
name = "twalk-test-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared integration-test harness for Twalk components: the test stack's lifecycle, the bus, contract validation, and a stub OpenAI-compatible LLM."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-nats = "0.50"
futures = "0.3"
jsonschema = "0.56"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
