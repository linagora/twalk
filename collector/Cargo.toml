[package]
name = "twalk-collector"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Twalk collector: the process that holds one OIDC grant for the owner's own accounts — a mailbox, a calendar — and publishes what involves other people as typed CloudEvents on the bus (ADR 0033)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "twalk-collector"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-nats = "0.50"
futures = "0.3"
getrandom = "0.3"
# rustls only, as every other crate here: the collector talks to the SSO,
# TMail and the calendar side service over TLS and needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
twalk-test-harness = { path = "../tests/harness" }
tempfile = "3"
