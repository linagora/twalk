[package]
name = "twalk-hermes"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hermes: the Twalk agent platform's consumer runtime, which hosts personas as separate processes."

[lib]
path = "src/lib.rs"

[[bin]]
name = "twalk-hermes"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-nats = "0.50"
futures = "0.3"
# The runtime asks a persona to stop the way an operator's process manager
# does — SIGTERM, then SIGKILL — and tokio's `Child::kill` only sends the
# second one.
libc = "0.2"
# The Companion Gateway's runtime settings — the model the user chose and
# their native language — are read over HTTP with the deployment's service
# token (ADR 0015, ADR 0016, ticket #184). The version and the feature set the
# Sensor pins for its own read of the consent snapshot, so the workspace-less
# repository still resolves one; rustls only, so a Gateway behind the
# operator's TLS proxy needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# The shared test harness: the test stack's lifecycle, the bus, contract
# validation and the stub LLM (tests/harness/, ticket #20).
twalk-test-harness = { path = "../tests/harness" }
