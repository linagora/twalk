# Test-only Synapse configuration for the Sensor integration harness.
# All secrets in this file are throwaway constants for a local, ephemeral
# stack — they must never be reused anywhere else.

server_name: "test.twalk"
pid_file: /data/homeserver.pid
report_stats: false

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

log_config: "/config/log.config"
media_store_path: /data/media_store

# Generated by Synapse on first start if absent (kept in the named volume).
signing_key_path: "/data/test.twalk.signing.key"
trusted_key_servers: []

macaroon_secret_key: "test-only-macaroon-secret"
form_secret: "test-only-form-secret"
registration_shared_secret: "test-only-registration-shared-secret"

# Open registration so test bots can be provisioned freely.
enable_registration: true
enable_registration_without_verification: true

# Rate limits effectively disabled: bots send bursts the defaults would reject.
rc_message:
  per_second: 10000
  burst_count: 10000
rc_room_creation:
  per_second: 10000
  burst_count: 10000
rc_registration:
  per_second: 10000
  burst_count: 10000
rc_login:
  address:
    per_second: 10000
    burst_count: 10000
  account:
    per_second: 10000
    burst_count: 10000
  failed_attempts:
    per_second: 10000
    burst_count: 10000
rc_presence:
  per_user:
    per_second: 10000
    burst_count: 10000
rc_joins:
  local:
    per_second: 10000
    burst_count: 10000
  remote:
    per_second: 10000
    burst_count: 10000
rc_invites:
  per_room:
    per_second: 10000
    burst_count: 10000
  per_user:
    per_second: 10000
    burst_count: 10000
