[package]
name = "twalk-sensor"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Twalk Sensor: a Matrix client that decrypts portal-room events and publishes typed CloudEvents on the bus."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-nats = "0.50"
futures = "0.3"
matrix-sdk = { version = "0.19", features = ["e2e-encryption"] }
# The Companion Gateway's consent snapshot is read over HTTP (ADR 0010).
# The version every other crate here pins, so the workspace-less repository
# still resolves one; rustls only, so a Gateway behind the operator's TLS
# proxy needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
anyhow = "1"
# matrix-sdk's `Room::send_attachment` takes the media type as a `Mime`:
# the encryption tests send a real encrypted attachment through it.
mime = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["full"] }
# The shared test harness: the test stack's lifecycle, the bus, contract
# validation and the stub LLM (tests/harness/, ticket #20).
twalk-test-harness = { path = "../tests/harness" }
