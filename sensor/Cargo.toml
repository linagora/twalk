[package]
name = "twalk-sensor"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Twalk Sensor: a Matrix client that decrypts portal-room events and publishes typed CloudEvents on the bus."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-nats = "0.50"
futures = "0.3"
matrix-sdk = { version = "0.19", features = ["e2e-encryption"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
anyhow = "1"
async-nats = "0.50"
jsonschema = "0.56"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["full"] }
