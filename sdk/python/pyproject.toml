[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twalk-sdk"
version = "0.1.0"
description = "Write a Twalk persona: the consent gate, the contract's persona envelopes, a durable bus subscription and an OpenAI-compatible LLM client."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
# Kept in step with requirements.txt, which is what the persona images
# install (pinned, because an image is a deployment artefact).
dependencies = ["nats-py>=2.9,<3", "httpx>=0.27,<0.29"]

[project.urls]
Repository = "https://github.com/linagora/twalk"

[tool.setuptools]
packages = ["twalk_sdk"]
