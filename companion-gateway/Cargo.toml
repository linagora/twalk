[package]
name = "twalk-companion-gateway"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Twalk Companion Gateway: serves the Companion PWA on its own origin and, in later tickets, owns consent state and the user's session."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
# The HTTP stack: axum for routing, tower-http's ServeDir for the Companion's
# static files (content types, conditional requests, byte ranges and
# path-traversal refusal are not code worth hand-rolling on a public origin).
# hyper, http, tower and tower-http are already in the repository's dependency
# graph through matrix-sdk and reqwest, so this adds a router, not a second
# web framework.
axum = "0.8"
# Sign-in talks to the homeserver over plain outbound HTTPS: the OpenID
# userinfo endpoint is the unauthenticated corner of the federation API, so
# no federation identity and no signing keys are needed (ADR 0011). rustls,
# not native-tls, so the image needs no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The session store: devices, their token digests and the OpenID replay
# ledger. SQLite is the Gateway's record of truth (ADR 0010); `bundled`
# compiles it in, so the runtime image needs no libsqlite3.
rusqlite = { version = "0.40", features = ["bundled"] }
# Device and refresh tokens are 256 bits straight from the OS CSPRNG.
getrandom = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
# Trace ids are carved out of a SHA-256 digest, as the Sensor's are
# (sensor/src/normalize.rs::originate_traceparent).
sha2 = "0.10"
# Synapse's admin registration endpoint authenticates the call by a hex
# HMAC-SHA1 over the request's fields, keyed with the registration shared
# secret (ticket #53). The algorithm is that endpoint's wire format, not a
# choice: hmac and sha1 are the same RustCrypto family as sha2 above, so this
# adds two small crates to a graph that already has their traits.
hmac = "0.12"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
anyhow = "1"
# Reading `openapi.yaml` in the conformance test (ticket #63). Test-only:
# the binary serves the description's bytes and never parses them. A
# maintained fork of serde_yaml, which is deprecated and unmaintained.
serde_yaml_ng = "0.10"
# Validating the Gateway's real responses against the response schemas of
# that description. OpenAPI 3.1 schemas *are* JSON Schema 2020-12, which is
# the whole reason the description is 3.1 and not 3.0 — the same validator
# the shared harness checks CloudEvents with (`tests/harness/src/contract.rs`).
jsonschema = "0.56"
# reqwest is a runtime dependency since ticket #52 (the OpenID verification
# call), and a package's dependencies are available to its test targets too:
# the tests drive the Gateway over HTTP with the same client.
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# The shared test harness: the test stack's lifecycle, the bus, contract
# validation and `poll_until` (tests/harness/, ticket #20). The Gateway
# skeleton needs only `poll_until` from it; its own process-boundary
# plumbing lives in tests/harness/mod.rs, as the Sensor's does.
twalk-test-harness = { path = "../tests/harness" }
