# The Companion Gateway's HTTP description (ticket #63).
#
# This file is the source of truth for the Gateway's HTTP surface, the way
# `contracts/cloudevents/v1/` is the source of truth for the bus: the
# Companion generates its TypeScript client from it, and
# `tests/openapi.rs` fails when the running binary and this document
# disagree. If a handler and this file disagree, one of the two is a bug —
# the test says which side moved.
#
# The Gateway serves these bytes at `GET /openapi.yaml`: the binary embeds
# the file with `include_str!` (`src/openapi.rs`), so the served description
# is this file and cannot drift from it.
#
# Every later ticket of spec #46 that adds an endpoint extends this document
# in the same commit — consent decisions (#49), the snapshot (#50), the
# registration relay (#53), the bridge facade. The conformance test makes
# that an obligation rather than a habit: a route registered in the router
# and absent here fails the suite.
openapi: 3.1.1

info:
  title: Twalk Companion Gateway
  # The version of the Gateway this document describes: the crate version,
  # which is also what `GET /health` reports. The conformance test asserts
  # the two are equal, so a released binary always carries a description of
  # itself.
  version: 0.1.0
  summary: The origin serving the Twalk Companion PWA, its session and its consent state.
  description: |
    One HTTP origin serves everything the Companion needs, so there is no
    CORS and the device token can be an `HttpOnly` cookie (ADR 0011).

    ## What is on this origin

    - the Gateway's own API, under `/api/`;
    - the operator's endpoints, `/health` and `/metrics`;
    - this description, at `/openapi.yaml`;
    - everything else: the Companion's own build, a SvelteKit static export
      served with the adapter's own path-resolution order.

    ## Authentication

    Every endpoint under `/api/` requires a live device token unless it is
    declared otherwise here — that is the implementation's default too, so a
    route added by a later ticket is protected before its author writes a
    line of authentication code. The exceptions are the sign-in itself
    (where a device gets its first token), the refresh (which authenticates
    the refresh token and rotates it), the registration relay (which runs
    before the account that would authenticate anyone exists — see
    `POST /api/bootstrap/account`) and the consent snapshot, whose caller is
    the Sensor and not a device: it takes the `serviceToken` scheme declared
    below, and refuses a device token.

    One endpoint lives outside `/api/` and still takes a credential: the
    bridge status webhook, under the Gateway's reserved `/_twalk/` prefix.
    Its caller is a mautrix bridge, which has no browser and no device, so
    it authenticates with that bridge's own `as_token` (`bridgeAsToken`).
    It is declared here, and in the implementation's own authentication
    table, precisely so that it is not a hole nobody wrote down.

    The device token travels as the `twalk_device` cookie
    (`HttpOnly`, `SameSite=Lax`, `Secure` off localhost) set by the
    sign-in and the refresh; the refresh token as `twalk_refresh`, scoped to
    `/api/session`. A browser sends both on its own — a generated client
    needs no `Authorization` header and must not try to read the cookies,
    which `HttpOnly` hides from JavaScript. `Set-Cookie` is deliberately not
    described per response: OpenAPI ignores that header by design, and the
    cookies' attributes are asserted by `tests/signin.rs`.

    ## Errors

    Every refusal the Gateway itself produces is a JSON document with an
    `error` member: a stable, machine-readable code a client branches on,
    never a sentence to parse. The codes are enumerated per status on each
    operation below. Some carry a human-readable `detail` for an operator's
    logs; a client must not display it to the user or match on it.

    Three answers are the same for every `/api` endpoint and are not
    repeated in prose on each one:

    - `401 unauthenticated` — no device token, or one that is unknown,
      expired or revoked. One answer for all three, so a probe learns
      nothing from the difference. Because the guard answers before routing,
      an unknown `/api` path also answers `401` to a caller with no device
      token: an unauthenticated client learns nothing about the API's shape.
      A signed-in client gets `404 not_found` with the path it asked for.
    - `405` with an `Allow` header and an empty body, for a described path
      requested with a method it does not have.
    - `503 sign_in_not_configured` — the deployment has no `GATEWAY_OWNER`,
      so nobody can sign in and the whole API is closed. The origin stays
      up, and the Companion can say what is wrong.

servers:
  - url: /
    description: |
      The Gateway's own origin — the origin the Companion was served from.
      There is no other: same-origin is what makes the cookie work.

tags:
  - name: session
    description: Signing in, the session's lifetime, and the user's devices.
  - name: bootstrap
    description: |
      Onboarding's two server-side steps: creating this deployment's one
      account (wireframe screen 2) and inviting the Sensor into the rooms the
      user chooses (screen 3d). Both are operations a Companion calls while
      onboarding and, in the account's case, exactly once ever.
  - name: consent
    description: |
      The data-processing decisions the owner takes, and the state they
      leave behind. The Gateway is the single writer of consent state
      (ADR 0006): it records each decision in an append-only journal, serves
      the current state as that journal's projection, and publishes each
      committed decision on the bus as a `consent.state.changed.v1` through
      a transactional outbox (ADR 0010).
  - name: contacts
    description: |
      Who has written to the user, and which of them is still waiting for a
      decision. The Gateway consumes `inbound.message.received` from the bus
      and keeps **only** a contact's Matrix ID, the network it wrote on and
      its first and last sighting - no message body, no display name, no
      `network_identifier`. That restraint is the feature: this is a list of
      correspondents, and what it refuses to hold is the only thing between
      it and a surveillance log
      (`docs/architecture/security-model.md`, residual risk 5).
  - name: bridges
    description: |
      Connecting a network: the login flows a bridge offers, starting one,
      polling where it has got to, answering its steps, cancelling, and
      logging out. The Gateway speaks each bridge's own provisioning API
      with that bridge's secret and **holds the blocking step itself**, so
      the browser polls a small document instead of holding a request a
      sleeping phone would kill (spec #47).

      The same tag carries the one endpoint a bridge calls rather than the
      Companion: the status webhook, which is mautrix's only push channel
      and the producer behind `bridge.status.changed.v1` on the bus.
  - name: operations
    description: What an operator and a deployment's probes read.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [operations]
      summary: Liveness, and the version handshake's server half.
      description: |
        Always `200` while the process answers. Liveness, not readiness.

        `version` is the stable half of the Companion's version handshake:
        the PWA is installed, so a service worker may hold an app shell built
        against an older Gateway. The client compares this value with the
        version baked into its own build and reloads when they differ.
        `revision` is provenance for an operator, not an input to the
        handshake.
      security: []
      responses:
        "200":
          description: The service is answering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /metrics:
    get:
      operationId: getMetrics
      tags: [operations]
      summary: The Prometheus text exposition.
      description: |
        The `twalk_companion_gateway_*` metrics, in the Sensor's conventions,
        as Prometheus text exposition format 0.0.4 — served with
        `Content-Type: text/plain; version=0.0.4; charset=utf-8`. Not for the
        Companion: for the operator's scrape.
      security: []
      responses:
        "200":
          description: The exposition, as a text document.
          content:
            text/plain:
              schema:
                type: string

  /openapi.yaml:
    get:
      operationId: getOpenApiDescription
      tags: [operations]
      summary: This description, as the running binary carries it.
      description: |
        The bytes of `companion-gateway/openapi.yaml`, embedded in the binary
        at build time. What a client generator points at to be sure it is
        describing the Gateway it is talking to, rather than a file from
        another revision of the repository.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 description of this Gateway.
          content:
            application/yaml:
              schema:
                type: string

  /api/deployment:
    get:
      operationId: describeDeployment
      tags: [session]
      summary: What this deployment is, before anyone can sign in.
      description: |
        Unauthenticated, and deliberately narrow. It exists so a screen can
        **ask** what it needs to know instead of attempting something and
        reading the failure — the pattern behind four defects found in one day
        of live testing (ticket #112): a first screen that offered to create an
        account and discovered on submit that one existed, a network screen
        that rendered an expired session as "your server could not be reached".

        `bootstrapped` is whether this deployment has its one account. It is
        the same fact the registration relay refuses on, so this publishes
        nothing a registration attempt would not reveal. `homeserver` is the
        server name, which is in the deployment's own DNS.

        Absent by design: the owner's Matrix ID. Naming the human who owns a
        deployment to anyone who can reach it is a different disclosure, and no
        screen needs it before sign-in.
      security: []
      responses:
        "200":
          description: The deployment describes itself.
          content:
            application/json:
              schema:
                type: object
                required: [bootstrapped, homeserver]
                additionalProperties: false
                properties:
                  bootstrapped:
                    type: boolean
                    description: Whether this deployment's one account exists.
                  homeserver:
                    type: string
                    description: The server name this deployment's owner is on.
                    examples: ["example.com"]
        "503":
          description: |
            `sign_in_not_configured` — this deployment has no owner at all — or
            `store_unreadable`, when the Gateway's store could not be read. A
            store that cannot answer is never reported as "no account yet":
            that would send a returning user back to the account form, which is
            the journey this operation exists to end.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [sign_in_not_configured, store_unreadable]
  /api/session:
    post:
      operationId: signIn
      tags: [session]
      summary: Sign this device in with a Matrix OpenID token.
      description: |
        The Companion asks its homeserver for an OpenID token
        (`POST /_matrix/client/v3/user/{userId}/openid/request_token`) and
        forwards that document here, unchanged. The Gateway verifies it at
        the homeserver's federation `openid/userinfo` endpoint, checks the
        resulting Matrix ID against the deployment's single owner, refuses a
        token it has already accepted, and issues its own pair of tokens.

        The Gateway never receives, stores or logs the Matrix access token
        that minted the OpenID token (ADR 0011).

        On success, two `Set-Cookie` headers carry the credentials: the
        device token (`twalk_device`, `Path=/`) and the refresh token
        (`twalk_refresh`, `Path=/api/session`). The response body names
        `expires_in` so the client refreshes on time instead of discovering
        the expiry as a `401`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: |
            Signed in. The device token and the refresh token are set as
            cookies; the body describes the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSession"
        "400":
          description: |
            The request body is not a sign-in document
            (`invalid_request`), or the OpenID token says it was minted by
            another homeserver than this deployment's — refused before any
            outbound call (`foreign_homeserver`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_request, foreign_homeserver]
        "401":
          description: |
            The homeserver does not know this token — never minted, expired
            or simply wrong (`openid_token_rejected`) — or the Gateway has
            already accepted it once (`openid_token_replayed`). Verification
            does not consume a token at the homeserver, so the Gateway keeps
            its own ledger and a second sign-in with the same token is
            refused.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [openid_token_rejected, openid_token_replayed]
        "403":
          description: |
            The token resolved to a Matrix ID that is not this deployment's
            owner — including when the homeserver answered with an ID it
            cannot speak for. One deployment serves one owner (ADR 0011),
            and the homeserver has other accounts, the Sensor's among them.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [not_the_owner]
        "500":
          $ref: "#/components/responses/StoreFailed"
        "502":
          description: |
            The homeserver could not be reached, or answered something that
            is not a userinfo document. An operator's problem, not the
            user's: the client should offer to retry rather than send the
            user back to a sign-in screen.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [homeserver_unverifiable]
        "503":
          $ref: "#/components/responses/SignInNotConfigured"
    get:
      operationId: getSession
      tags: [session]
      summary: Who is signed in, on which device.
      description: |
        What the Companion asks on boot to know whether it must show the
        sign-in screen: a `200` means the cookie it already holds is live.
      security:
        - deviceToken: []
      responses:
        "200":
          description: The session this device's token belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"
    delete:
      operationId: signOut
      tags: [session]
      summary: Sign this device out, revoking it.
      description: |
        Signing out revokes the device: a device the user signed out of is a
        device that should stop working, and signing in again is a silent
        round trip for the Companion. Both cookies are cleared.
      security:
        - deviceToken: []
      responses:
        "204":
          description: |
            Signed out. The device is revoked, and both session cookies are
            cleared.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/StoreFailed"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

  /api/session/refresh:
    post:
      operationId: refreshSession
      tags: [session]
      summary: Exchange the refresh token for a new pair.
      description: |
        Authenticated by the refresh cookie rather than the device cookie —
        the device token is short-lived by design. Both tokens are rotated,
        so a device token that leaked dies at the next refresh instead of
        living out its lifetime; the previous refresh token stops working
        immediately.

        The refresh cookie is scoped to `/api/session`, so it is not sent
        with every static file and every API call.
      security:
        - refreshToken: []
      responses:
        "200":
          description: |
            A new device token and a new refresh token, set as cookies, with
            the session document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSession"
        "401":
          description: |
            No refresh cookie, or one that is unknown, expired, already
            rotated, or belongs to a revoked device. The client's answer is
            to sign in again.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [unauthenticated]
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

  /api/devices:
    get:
      operationId: listDevices
      tags: [session]
      summary: The devices that have signed in.
      description: |
        Every device, revoked ones included and dated, so that "I revoked
        that phone" stays visible. The device the request came from is
        flagged `current`.
      security:
        - deviceToken: []
      responses:
        "200":
          description: The device list, newest activity first is not implied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/StoreFailed"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

  /api/devices/{id}:
    delete:
      operationId: revokeDevice
      tags: [session]
      summary: Revoke one device.
      description: |
        The device's token stops working on its very next request, including
        when that device is the caller's own — nothing is cached. The row
        stays in the list with its revocation date; its token digests are
        dropped.
      security:
        - deviceToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The device's id, as the device list reports it.
          schema:
            type: string
      responses:
        "204":
          description: The device is revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: |
            No device of this deployment has that id, or it was already
            revoked. One answer for both: the caller asked for that device
            to stop working, and it does not work.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [not_found]
        "500":
          $ref: "#/components/responses/StoreFailed"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

  /api/bootstrap/account:
    post:
      operationId: createOwnerAccount
      tags: [bootstrap]
      summary: Create this deployment's one account, once.
      description: |
        Wireframe screen 2. The Gateway creates the account on the homeserver
        with Synapse's admin registration endpoint, which is authenticated by
        a MAC keyed with the registration shared secret rather than by an
        admin token — and which works while the homeserver's own
        self-service registration stays off. That is the point: a personal
        server does not become a public one to give its owner an account.

        **Exactly one account, ever.** `username` must be the localpart of
        this deployment's `GATEWAY_OWNER`; anything else is `403`. Once that
        account exists, every further attempt is `409`, enforced both by the
        Gateway's own store and by the homeserver's `M_USER_IN_USE`, so
        losing the Gateway's volume does not re-open the window.

        **No credential is required, and none exists yet.** This runs before
        the account anyone could sign in with, so it is the one `/api`
        endpoint outside the guard. What stands in for authentication is the
        rule above, plus the operator's decision to set
        `GATEWAY_REGISTRATION_SHARED_SECRET` at all: unset, this endpoint
        answers `503` and the window never opens. The residual risk is
        stated in `docs/architecture/security-model.md`.

        **The recovery key is neither accepted nor returned.** It is
        generated in the browser and used there (ADR 0014), so screen 2's
        "Twalk never sees it" is a property of where the code runs. The
        request object is closed, and a body carrying any
        recovery-key-shaped member is refused with `recovery_key_refused`
        rather than quietly ignored.

        **The access token in the answer passes through and is not kept.**
        It is the Matrix session the browser continues in — what
        matrix-js-sdk bootstraps the cross-signing identity and the recovery
        key with. The Gateway writes it nowhere and logs it nowhere
        (ADR 0011).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: |
            The account exists. The body is the Matrix session the Companion
            continues in the browser, and nothing else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAccount"
        "400":
          description: |
            The body is not a registration document — a missing or empty
            field, or any member the request object does not declare
            (`invalid_request`) — or it carried something recovery-key-shaped
            (`recovery_key_refused`), which the Gateway refuses to see.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_request, recovery_key_refused]
        "403":
          description: |
            The username is not this deployment's owner. Refused before the
            registration secret is used at all: the relay creates the
            owner's account or none.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [not_the_owner]
        "409":
          description: |
            This deployment's account has already been created. The client's
            move is to sign in, not to retry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [account_already_exists]
        "502":
          description: |
            The homeserver refused the creation, carrying its own error code
            in `matrix_errcode` — a password policy, a username it will not
            accept, a registration shared secret it does not share
            (`homeserver_refused`) — or could not be reached at all
            (`homeserver_unreachable`). An operator's problem in both cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeserverRefusal"
        "503":
          description: |
            Either this deployment relays no registration
            (`GATEWAY_REGISTRATION_SHARED_SECRET` unset — its account was
            provisioned by its operator: `registration_not_configured`), or
            it has no owner at all and the whole API is closed
            (`sign_in_not_configured`). `detail` names the variable that
            would open it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum:
                          [registration_not_configured, sign_in_not_configured]

  /api/bootstrap/rooms:
    post:
      operationId: inviteSensorIntoRooms
      tags: [bootstrap]
      summary: Invite the Sensor into the rooms the user selected.
      description: |
        Wireframe screen 3d. The Sensor observes the rooms it was invited to
        and nothing else, and an invitation has to come from an account that
        is in the room — the user's. So the Companion sends the user's own
        Matrix access token with the room list: the Gateway reads the
        Sensor's membership in each room, invites it where it is absent, and
        **forgets the token when the call returns**. It is a parameter of
        this one operation, never stored and never logged (ADR 0011), which
        `tests/bootstrap.rs` asserts against the store's bytes and the
        captured log output.

        Using the user's token rather than an admin credential is also what
        works on a homeserver with password login disabled: an invitation
        needs no more than the inviter's own session.

        One room failing does not fail the others — the user ticked several
        and wants to know which took — so `200` carries one outcome per
        room, in the order they were asked about. A token the homeserver
        rejects is `401` instead, because then nothing was attempted
        anywhere. Asking about a room the Sensor is already in is
        `already_present`, not an error.

        The Sensor's own account is provisioned by the deployment, not by
        this endpoint, and its startup depends on nothing here.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteSensorRequest"
      responses:
        "200":
          description: |
            Every selected room was asked about. Read each outcome: the
            request as a whole succeeded even where a room did not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorInvitation"
        "400":
          description: |
            The body is not an invitation document — a missing or empty
            field, or any member the request object does not declare
            (`invalid_request`) — or it named more rooms than one request
            may carry (`too_many_rooms`), or it carried something
            recovery-key-shaped (`recovery_key_refused`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum:
                          [invalid_request, too_many_rooms, recovery_key_refused]
        "401":
          description: |
            No device token, or one that is unknown, expired or revoked
            (`unauthenticated`) — or the homeserver rejected the *Matrix*
            access token in the body, in which case nothing was invited
            anywhere (`matrix_token_rejected`). The second is the user's
            Matrix session having expired, not their Gateway session: the
            client's move is to log in to Matrix again, not to sign in here.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [unauthenticated, matrix_token_rejected]
        "502":
          description: |
            The homeserver could not be reached at all, so no room was
            asked about.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [homeserver_unreachable]
        "503":
          description: |
            Either this deployment does not know which Sensor to invite
            (`GATEWAY_SENSOR_USER_ID` unset: `sensor_not_configured`), or it
            has no owner at all and the whole API is closed
            (`sign_in_not_configured`). `detail` names the variable that
            would open it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [sensor_not_configured, sign_in_not_configured]

  /api/consent/decisions:
    post:
      operationId: recordConsentDecision
      tags: [consent]
      summary: Record one consent decision.
      description: |
        The body mirrors the contract's own `data` object
        (`contracts/cloudevents/v1/consent.state.changed.schema.json`) minus
        what the Gateway stamps itself: `old_state` comes from the journal,
        `occurred_at` from the Gateway's clock, `actor` from the
        deployment's owner.

        The answer returns as soon as the decision is **committed**.
        Publication follows through a transactional outbox, so a bus that is
        down delays the event and never refuses the decision — and a crash
        between the commit and the publication republishes rather than
        loses, deduplicated on the bus by the event's own deterministic id.

        `subject.type` is `contact`, `network` or `persona`. A persona is on
        this path and not on a control API of its own, because activating or
        pausing one *is* a consent decision (ADR 0013): `scope.networks` on a
        persona subject names the networks that persona may read, so
        activation never spreads — a network connected afterwards is in no
        scope the user decided on, and the persona stays inactive on it until
        they say otherwise. Pausing a persona is `new_state: revoked` on it:
        the persona still runs and is still supervised, and receives nothing.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentDecisionRequest"
      responses:
        "201":
          description: |
            The decision is recorded, and the event named by `event_id` is
            on its way to the bus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordedConsentDecision"
        "200":
          description: |
            The identical decision — same subject, same state, same
            perimeter, same instant — was already in the journal, so
            nothing was recorded and `replayed` is `true`. The body is the
            decision as it was first recorded, with its original
            `event_id`: the contract's ids are deterministic, so a retried
            request never becomes a second decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordedConsentDecision"
        "400":
          description: |
            The decision is not one the contract allows.

            - `malformed_request` — a required member is missing or of the
              wrong type, or the body is not JSON.
            - `unknown_value` — a value outside the contract's enums: a
              `new_state`, a network, a `subject.type`. `unset` is not a
              state to move to; it is the absence of a decision.
            - `unsupported_subject_type` — a subject type the contract has
              that this endpoint does not accept. Nothing is in that state
              today; the code stays enumerated so a client that branches on
              it keeps working.
            - `scope_contradicts_subject` — a `network` subject whose scope
              is not exactly its own network, which the contract forbids.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum:
                          [
                            malformed_request,
                            unknown_value,
                            unsupported_subject_type,
                            scope_contradicts_subject,
                          ]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ConsentStoreUnavailable"
        "503":
          $ref: "#/components/responses/ConsentNotConfigured"

  /api/consent/state:
    get:
      operationId: getConsentState
      tags: [consent]
      summary: The current consent state, as recorded.
      description: |
        One entry per (subject, network): the state the most recent decision
        covering them left behind. It is a projection of the decision
        journal, not a second record of truth.

        `network` entries are that network's default and `contact` entries
        override them — this endpoint reports what was *recorded*, and
        `/api/consent/effective` applies the precedence. Revocations are as
        explicit as grants, and an absent subject means "never decided",
        never "revoked".

        This endpoint is the owner's own read, behind a device token, and it
        names no stream position. It **includes** `persona` subjects, which is
        how the dashboard knows which personas the user activated and on which
        networks. The snapshot a cold consumer reads is
        `GET /api/consent/snapshot`: the same entries plus the JetStream
        sequence they reflect, authenticated by the Sensor's service token,
        and with `persona` subjects excluded — a persona is not consent state
        a Sensor labels senders by. Neither is paginated.
      security:
        - deviceToken: []
      responses:
        "200":
          description: Every recorded (subject, network) entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ConsentStoreUnavailable"
        "503":
          $ref: "#/components/responses/ConsentNotConfigured"

  /api/consent/effective:
    get:
      operationId: getEffectiveConsent
      tags: [consent]
      summary: The consent state that applies to one contact on one network.
      description: |
        The precedence, resolved: the contact's own decision if it has one,
        the network's default otherwise, and `pending` when neither exists —
        with `decided_by` naming the decision that answered, or `null` when
        none did. That `null` is how a caller tells "never decided" from
        "decided pending"; an absent decision is never a revocation.
      security:
        - deviceToken: []
      parameters:
        - name: contact
          in: query
          required: true
          description: The contact's Matrix user ID.
          schema:
            type: string
            minLength: 1
          example: "@whatsapp_33612345678:example.com"
        - name: network
          in: query
          required: true
          description: The network the question is about.
          schema:
            $ref: "#/components/schemas/Network"
      responses:
        "200":
          description: The state that applies, and what decided it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConsent"
        "400":
          description: |
            `malformed_request` when `contact` or `network` is missing or
            empty; `unknown_value` when `network` is not one of the
            contract's.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [malformed_request, unknown_value]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/ConsentStoreUnavailable"
        "503":
          $ref: "#/components/responses/ConsentNotConfigured"

  /api/consent/snapshot:
    get:
      operationId: getConsentSnapshot
      tags: [consent]
      summary: The whole consent state, with the stream position it reflects.
      description: |
        What a consumer whose cache is cold reads before it follows the bus
        (ADR 0010). A durable consumer resumes at its ack floor, so decisions
        it has already applied are never redelivered; this endpoint answers
        the question directly, and names the JetStream sequence its content
        reflects so the consumer can carry on from there.

        **The hand-off.** Apply `entries`, then create the stream consumer at
        `next_stream_sequence` — which is `stream_sequence + 1`, spelled out
        because that off-by-one is the one mistake that would skip a
        decision. Every decision ever taken is then in exactly one of the
        two: in this snapshot, or on the stream after `stream_sequence`.
        Never both, never neither.

        That holds because the snapshot reflects the journal's **published
        prefix**: a decision still waiting in the Gateway's outbox has no
        position on the bus yet, so it is left out of the content and
        arrives, in order, after the position named here. A bus outage
        therefore delays what the snapshot knows rather than corrupting the
        hand-off. With nothing published yet, `stream_sequence` is `0` and
        the consumer starts at `1`: the whole stream.

        **What is in `entries`.** One entry per (subject, network):
        `network` entries are that network's default and `contact` entries
        override them, exactly as `GET /api/consent/state` reports them and
        with the precedence resolved by `GET /api/consent/effective`.
        Revocations are as explicit as grants — an absent subject means
        "never decided", never "revoked", which is the distinction the shape
        exists to keep. `persona` subjects are excluded: activating a persona
        is a consent decision (ADR 0013), but it is not state a consumer
        labels senders by.

        **Not paginated.** A cursor would be a second ordering to get wrong,
        and a half-applied snapshot is worse than none. Instead there is a
        cap (`GATEWAY_CONSENT_SNAPSHOT_MAX_ENTRIES`, 100000 by default) and a
        state over it is refused with `snapshot_too_large` rather than
        truncated.

        **Authentication.** A service token from the Gateway's own
        configuration (`GATEWAY_SERVICE_TOKEN`), as `Authorization: Bearer`.
        Its caller is the Sensor: a service, not one of the owner's browsers,
        with no Matrix OpenID token to sign in with and no cookie to send.
        The two credentials are disjoint — a device token is not accepted
        here, and this token opens no other endpoint. There is no timestamp
        and no version in the answer: the stream sequence is the only
        ordering this design trusts.
      security:
        - serviceToken: []
      responses:
        "200":
          description: |
            The whole consent state, and the position it reflects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentSnapshot"
        "401":
          description: |
            `unauthenticated` — no `Authorization: Bearer` header, one the
            Gateway cannot read, or a token that is not this Gateway's
            service token. One answer for all of them, so a probe learns
            nothing from the difference; a device token is one of the things
            refused here.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [unauthenticated]
        "500":
          description: |
            - `snapshot_too_large` — the consent state holds more entries
              than this Gateway serves in one snapshot. The snapshot is
              refused whole and `detail` names the cap: a silently truncated
              snapshot would tell a consumer that contacts the user granted
              were never decided about.
            - `store_unavailable` — the consent journal could not be read.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [snapshot_too_large, store_unavailable]
        "503":
          description: |
            - `service_token_not_configured` — `GATEWAY_SERVICE_TOKEN` is
              unset, so this Gateway serves no snapshot to anyone. Answered
              before authentication, so an unauthenticated caller learns
              nothing about the deployment's consent configuration beyond
              this.
            - `consent_not_configured` — the token is configured and
              correct, but `GATEWAY_NATS_URL` is not set, so there is no
              consent journal to snapshot.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum:
                          [service_token_not_configured, consent_not_configured]

  /api/contacts/pending:
    get:
      operationId: getPendingContacts
      tags: [contacts]
      summary: The contacts waiting for a consent decision.
      description: |
        Screen 5's "3 consent decisions waiting", and the list behind it.

        **What a contact is here.** Four values, and there will never be a
        fifth: the sender's Matrix user ID as the bridge materialised it, the
        network it wrote on, and the first and last instants it did - taken
        from the events' own `time`, never from the Gateway's clock, so a
        Gateway installed after weeks of Sensor traffic reports when those
        contacts actually wrote. There is no message body here, no display
        name and no `network_identifier`: the Gateway's store holds none of
        them, so no read of it can hand them out. Display names are a
        separate call, answered from the bus and written nowhere - see
        `GET /api/contacts/display-names`.

        Note what storing the Matrix ID does and does not hide: a bridged
        ghost user's ID conventionally embeds the network identifier
        (`@whatsapp_33612345678:example.com`), so this list keeps phone
        numbers although it has no field for one. It is stored because a
        consent decision has to name its subject and that ID is the subject.

        **What "waiting" means.** The same question
        `GET /api/consent/effective` answers with `decided_by: null`: neither
        this contact's own decision nor its network's default exists. So
        granting or revoking a whole network empties this list of every
        contact on it at once, and a contact the owner deliberately left
        `pending` is *not* in it - they answered, and the answer was "not
        yet". The owner's own Matrix ID is never in it either: their messages
        travel through the same rooms, and nobody is their own correspondent.

        **The numbers.** `total` and `networks` always count the whole list,
        whatever `?network=` narrows `contacts` to, so a badge and the list
        beside it can never disagree.

        Not paginated and not capped, like `GET /api/consent/state`.
      security:
        - deviceToken: []
      parameters:
        - name: network
          in: query
          required: false
          description: |
            Narrows `contacts` to one network. The counts are unaffected.
          schema:
            $ref: "#/components/schemas/Network"
      responses:
        "200":
          description: The contacts waiting for a decision, and their counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingContacts"
        "400":
          description: |
            `unknown_value` - `network` is not one of the contract's.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [unknown_value]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          description: |
            `store_unavailable` - the Gateway's store could not be read.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [store_unavailable]
        "503":
          $ref: "#/components/responses/ContactsNotConfigured"

  /api/contacts/display-names:
    get:
      operationId: getContactDisplayNames
      tags: [contacts]
      summary: What these contacts are called, read from the bus.
      description: |
        A separate call from the list, because the Gateway stores no display
        name: a record of who writes to the user *and what they are called*
        is a directory, and the pending-contact store exists precisely to not
        be one. A name is looked up when a screen needs it and kept nowhere
        afterwards - not in the store, not in a cache, not in the logs.

        The Gateway reads the tail of the inbound stream, takes the most
        recent name it finds for each contact asked about, and drops
        everything else it walked past. The read is bounded, so a contact
        whose last message has fallen outside that window comes back with
        `display_name: null`. That is a real answer and not a failure: the
        Companion then shows the Matrix ID, which is what the decision will
        name anyway.

        `contact` repeats, once per contact
        (`?contact=@a:example.com&contact=@b:example.com`), and the answer
        holds one entry per distinct contact asked about, in the order they
        were asked. Asking about more than 200 at once is refused rather than
        truncated, so a short answer never passes for a complete one.
      security:
        - deviceToken: []
      parameters:
        - name: contact
          in: query
          required: true
          description: |
            A contact's Matrix user ID. Repeat the parameter to ask about
            several, at most 200 per call.
          schema:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
          style: form
          explode: true
          example: ["@whatsapp_33612345678:example.com"]
      responses:
        "200":
          description: |
            One entry per contact asked about, its `display_name` `null` when
            the bus no longer carries one for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDisplayNames"
        "400":
          description: |
            `malformed_request` - no `contact` parameter at all, or more than
            200 of them.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [malformed_request]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "502":
          description: |
            `bus_unreachable` - the display names could not be read from the
            bus. The pending list itself is unaffected: it comes from the
            Gateway's own store, and the Companion can show the Matrix IDs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [bus_unreachable]
        "503":
          $ref: "#/components/responses/ContactsNotConfigured"

  /api/bridges:
    get:
      operationId: getBridges
      tags: [bridges]
      summary: The bridges this deployment can connect a network through.
      description: |
        Configuration plus the Gateway's own memory: **no bridge is
        contacted**, so the networks screen draws even while every bridge is
        down. Each entry carries the login that bridge has in flight, or
        `null` when nothing has been started on it.

        A deployment with no bridge configured answers an empty list. That is
        the honest answer to "what can I connect?", not an error — bridges
        are opt-in in the reference deployment, behind a compose profile.
      security:
        - deviceToken: []
      responses:
        "200":
          description: Every configured bridge, in configuration order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

  /api/bridges/{bridge_id}/login/flows:
    get:
      operationId: getBridgeLoginFlows
      tags: [bridges]
      summary: The login flows this bridge offers.
      description: |
        Asked of the bridge itself (`GET /_matrix/provision/v3/login/flows`),
        so the list is the bridge's and not a table Twalk keeps: a QR flow, a
        phone number, a cookie paste, whatever that bridge version has. The
        `id` of one of them is what `POST .../login` takes as `flow_id`.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/bridgeId"
      responses:
        "200":
          description: The flows, as the bridge describes them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeLoginFlows"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UnknownBridge"
        "502":
          $ref: "#/components/responses/BridgeUnavailable"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

  /api/bridges/{bridge_id}/login:
    post:
      operationId: startBridgeLogin
      tags: [bridges]
      summary: Start a login on this bridge, or repair an existing one.
      description: |
        Answers at once, with the flow's **first step already in it**: a QR
        flow returns the first code here, and the Companion polls
        `GET` on this same path from then on.

        Pass `login_id` to **reconnect**: the flow then re-logs in to the
        login the bridge already holds (mautrix's `?login_id=`), which is how
        a broken session is repaired. It never restarts a container, and it
        never creates a second login.

        One login at a time per bridge instance in v0.1 — the contract has no
        login dimension yet (spec #47) — so starting a second while one is in
        flight is `409 login_in_flight`, whose `detail` names the device and
        the instant that started the first. A login that has completed,
        failed or been cancelled does not stand in the way.

        The acting Matrix user is this deployment's owner, from
        configuration: mautrix's shared-secret auth takes the acting user on
        trust, so it is never something a request can choose (ADR 0011).
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/bridgeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBridgeLoginRequest"
      responses:
        "201":
          description: |
            The login is started, and its first step is in the body. Poll
            `GET /api/bridges/{bridge_id}/login` from here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeLogin"
        "400":
          description: |
            `invalid_request` — the body is not JSON, or names no `flow_id`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_request]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            `too_many_logins` — the network itself will not accept another
            login on this account (`FI.MAU.BRIDGE.TOO_MANY_LOGINS`). The user
            removes a linked device on the network, or logs one of this
            bridge's logins out.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [too_many_logins]
        "404":
          description: |
            `unknown_bridge` — no such bridge is configured.
            `not_found_on_bridge` — the bridge does not know the `login_id`
            this request asked to repair.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [unknown_bridge, not_found_on_bridge]
        "409":
          description: |
            `login_in_flight` — a login is already running on this bridge.
            `detail` names the device that started it and when, so the user
            can tell "my other phone is mid-scan" from "the server is stuck".
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [login_in_flight]
        "502":
          $ref: "#/components/responses/BridgeUnavailable"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

    get:
      operationId: getBridgeLogin
      tags: [bridges]
      summary: The state of the login in flight — the document the Companion polls.
      description: |
        **Always immediate.** The blocking step of a mautrix login lives
        inside the Gateway, not in the browser: the Gateway sits in
        `POST /_matrix/provision/v3/login/step/…/display_and_wait` — which
        does not answer until the phone does — and this endpoint reports
        whatever the last answer was. A phone that sleeps mid-scan therefore
        loses a poll and not the login.

        `generation` is the number to watch: it changes every time the bridge
        hands back a new step, **refreshes included**. A refreshed QR is a
        bumped generation with a new `step.payload.data` — that is the signal
        to redraw, before the code on screen expires. `step.expires_at` and
        `step.valid_for_seconds` say how long the one on screen is worth
        acting on; for a QR that is the Gateway's own estimate of the
        network's refresh interval, because the bridge states no expiry.

        A login that finished, failed or was cancelled is still reported, so
        the Companion can show how it ended; `404 no_login_in_flight` means
        nothing was ever started on this bridge.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/bridgeId"
      responses:
        "200":
          description: The login's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeLogin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NoBridgeLogin"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

    delete:
      operationId: cancelBridgeLogin
      tags: [bridges]
      summary: Cancel the login in flight.
      description: |
        Cancels the current step — which is what releases the request the
        Gateway is holding — and then the process, so the bridge forgets it
        rather than keeping it until its 30-minute cap. The login's state
        then reads `cancelled` until something else is started, and the
        bridge is free for the next attempt at once.

        A bridge that has already forgotten the process is not an error here:
        the login is over either way, which is what was asked for.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/bridgeId"
      responses:
        "204":
          description: The login is cancelled. No body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NoBridgeLogin"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

  /api/bridges/{bridge_id}/login/submit:
    post:
      operationId: submitBridgeLoginStep
      tags: [bridges]
      summary: Answer the step the login is waiting on.
      description: |
        For a step whose `type` is `user_input` or `cookies` — the ones where
        the login waits for the user rather than for the network. `data` is
        passed to the bridge **untouched**: the Gateway does not know what a
        given network's input fields are called and does not pretend to.

        What travels here is a network credential — a phone number, the seven
        Google cookies of the SMS preview path — and it is relayed and
        forgotten (ADR 0011). Nothing stores it, and the Gateway's log line
        records the *shape* of what went through and never a value.

        The answer is the login's new state: the next step, or `complete`.
        Submit against the `step_id` the polled state reports; anything else
        is `400`, because a stale client answering an old step would
        otherwise silently do nothing.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/bridgeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitBridgeLoginStepRequest"
      responses:
        "200":
          description: The step was accepted; the body is the login's new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeLogin"
        "400":
          description: |
            `invalid_request` — the body is not JSON, names no `step_id`,
            carries no `data` object, names a step this login is not on, or
            arrives while the Gateway is holding a blocking step (there is
            nothing to submit then).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_request]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NoBridgeLogin"
        "409":
          description: |
            `step_cancelled` — the step was cancelled on the bridge's side
            before this answer arrived (`FI.MAU.LOGIN_STEP_CANCELLED`). Poll
            the login and act on the step it reports.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [step_cancelled]
        "410":
          description: |
            `login_expired` — the login is over: cancelled, timed out, or
            already finished (mautrix's three 410s). A login in flight lives
            in the bridge's memory, for at most 30 minutes and only while the
            network's own code is valid. Start a new one.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [login_expired]
        "502":
          $ref: "#/components/responses/BridgeUnavailable"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

  /api/bridges/{bridge_id}/logins:
    get:
      operationId: getBridgeLogins
      tags: [bridges]
      summary: The logins this bridge already holds.
      description: |
        Asked of the bridge (`GET /_matrix/provision/v3/logins`). This is
        what the Companion reads to offer "reconnect": the `login_id` to pass
        back to `POST .../login`, and the name the network gives the account.

        One login per bridge instance is the v0.1 constraint, so this list
        normally holds none or one; it is a list because the bridge's API is,
        and because a second account on one network is what a later contract
        version adds.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/bridgeId"
      responses:
        "200":
          description: The logins the bridge holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeLogins"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UnknownBridge"
        "502":
          $ref: "#/components/responses/BridgeUnavailable"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

  /api/bridges/{bridge_id}/logins/{login_id}:
    delete:
      operationId: logoutBridgeLogin
      tags: [bridges]
      summary: Log this login out of its network.
      description: |
        The bridge drops the session and the network credentials it kept for
        it; the Gateway never held either, so there is nothing on its side to
        forget. The network's own "linked devices" list is where the user
        sees the other half of this.

        A login the bridge does not have is `404 not_found_on_bridge` — the
        distinction from `unknown_bridge` matters, because one is a
        configuration problem and the other is a stale screen.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/bridgeId"
        - name: login_id
          in: path
          required: true
          description: The login to drop, as `GET .../logins` names it.
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: The login is gone. No body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: |
            `unknown_bridge` — no such bridge is configured.
            `not_found_on_bridge` — the bridge holds no such login.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [unknown_bridge, not_found_on_bridge]
        "502":
          $ref: "#/components/responses/BridgeUnavailable"
        "503":
          $ref: "#/components/responses/SignInNotConfigured"

  # The one route on this origin whose caller is not a browser and not the
  # Sensor, but a bridge (ticket #56). Outside `/api/` for that reason, under
  # the Gateway's reserved `/_twalk/` prefix.
  /_twalk/bridges/{bridge_id}/status:
    post:
      operationId: pushBridgeStatus
      tags: [bridges]
      summary: A bridge pushes its connection state.
      description: |
        Mautrix's **only** push channel, and the producer behind
        `bridge.status.changed.v1` on the bus. Each bridge's
        `homeserver.status_endpoint` names this URL; the bridge POSTs its
        `BridgeState` here whenever its connection state changes, retried
        with backoff and deduplicated on its own side within a TTL.

        This is not an endpoint the Companion calls, and not one a generated
        client has any use for. It is described because every answer this
        origin gives is described.

        **Authentication.** The calling bridge's own `as_token`, as
        `Authorization: Bearer` — the same value as that bridge's
        `appservice.as_token` and as `GATEWAY_BRIDGE_<ID>_AS_TOKEN` in the
        Gateway's configuration. Trusting the caller's position on the
        compose network instead was explicitly refused: every container on
        that network can reach this port, and a forged push could tell the
        user a dead session was healthy. A device token is not accepted here,
        and an `as_token` opens nothing else.

        **What the Gateway does with it.** `state_event` is translated into
        the contract's vocabulary — `BAD_CREDENTIALS` to `session_expired`
        (this, not `LOGGED_OUT`, is what a remotely revoked session reports),
        `TRANSIENT_DISCONNECT` to `degraded`, `CONNECTING` and `BACKFILLING`
        to `starting`, `CONNECTED` to `connected`, anything else to
        `disconnected` — compared with the state this bridge was last known
        to be in, and published as a transition only if the two differ. A
        repeated identical state is accepted and publishes nothing.
      security:
        - bridgeAsToken: []
      parameters:
        - $ref: "#/components/parameters/statusBridgeId"
      requestBody:
        required: true
        description: |
          A mautrix `BridgeState`. Only `state_event` is required; the rest
          is read when present and ignored when not. A `GlobalBridgeState`
          wrapper (`remoteState`) is unwrapped.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeStatePush"
      responses:
        "204":
          description: |
            The push was verified and applied. No body, and deliberately the
            same answer whether or not it changed anything: a bridge has no
            use for the difference, and a distinct status would only invite
            it to retry on one of them.
        "400":
          description: |
            `invalid_request` — the body is not JSON, or not a mautrix
            `BridgeState`: it carries no `state_event`, which is the one
            thing this endpoint exists to receive.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_request]
        "401":
          description: |
            `unauthenticated` — no `Authorization: Bearer` header, one the
            Gateway cannot read, or a token that is not this bridge's
            `as_token`. One answer for all of them. The bridge retries with
            backoff, so an operator whose two halves disagree sees this
            again rather than once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [unauthenticated]
        "404":
          description: |
            `unknown_bridge` — no configured bridge reports status under this
            id. It is `GATEWAY_BRIDGE_<ID>_STATUS_ID`, which defaults to the
            instance id with `mautrix-` stripped under a `bridge-` prefix.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [unknown_bridge]
        "500":
          description: |
            `store_unavailable` — the transition could not be recorded. The
            push is not applied, and the bridge's retry is the recovery.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [store_unavailable]
        "503":
          description: |
            - `sign_in_not_configured` — this deployment has no owner, so it
              has no store and no bus either.
            - `bridge_status_not_configured` — `GATEWAY_NATS_URL` is unset,
              so there is nowhere to record a transition and nowhere to
              publish it. Saying so beats accepting a push and throwing it
              away.
            - `as_token_not_configured` — the bridge is configured, but this
              Gateway holds no `as_token` for it, so the push cannot be
              verified. An unverified push is refused, never trusted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum:
                          [
                            sign_in_not_configured,
                            bridge_status_not_configured,
                            as_token_not_configured,
                          ]

  /{companionPath}:
    get:
      operationId: getCompanionFile
      tags: [operations]
      summary: The Companion's own build.
      description: |
        Every path the Gateway's own routes do not claim is the Companion's.
        One templated segment stands here for the whole remaining path,
        however many segments it has: OpenAPI path templating cannot express
        a wildcard, and this operation is documentation for a human and a
        conformance test, not something a generated client calls — the
        browser fetches these paths by navigating.

        The resolution order is SvelteKit's static-adapter preview server's:
        the exact file; else the path plus `index.html` (trailing slash) or
        plus `.html`; else a `307` to whichever trailing-slash spelling the
        build does have; else the SPA fallback (`200.html`) with `200`, so a
        deep link reloaded cold loads the app instead of a `404`.

        The `/api/` prefix is the one exception to that fallback: under it a
        `404` stays a `404`, as JSON, because a client parsing an API
        response must never be handed an HTML page instead.
      security: []
      parameters:
        - name: companionPath
          in: path
          required: true
          description: The request path, standing for any number of segments.
          schema:
            type: string
      responses:
        "200":
          description: |
            The file the build has for this path, or — for a route that
            exists only in the client-side router — the SPA fallback. The
            content type is the one the path's extension calls for, and
            `text/html` when it has none; `.wasm` is exactly
            `application/wasm`, with no parameters, or
            `WebAssembly.instantiateStreaming` refuses it. A pre-compressed
            sibling (`.br`, `.gz`) is served with the matching
            `Content-Encoding` to a client that accepts it.
          content:
            text/html:
              schema:
                type: string
            application/wasm:
              schema:
                type: string
                contentMediaType: application/wasm
            "*/*":
              schema:
                type: string
                description: Any other asset of the build.
        "307":
          description: |
            The build has this page under its other trailing-slash spelling;
            `Location` names it, with the query string preserved.
        "404":
          description: |
            There is no build to serve at all — not even a fallback file — so
            `GATEWAY_STATIC_DIR` points at nothing the Gateway can serve.
            A plain-text message naming the directory, for the operator who
            will read it in a browser. The origin stays up: `/health` and
            `/metrics` keep answering.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    deviceToken:
      type: apiKey
      in: cookie
      name: twalk_device
      description: |
        The Gateway's own per-device credential, issued once a Matrix OpenID
        token has proved the owner's identity: `HttpOnly`, `SameSite=Lax`,
        `Secure` off localhost, short-lived, revocable per device, and never
        a Matrix access token (ADR 0011). The browser sends it on its own; a
        generated client cannot read it and must not try.
    refreshToken:
      type: apiKey
      in: cookie
      name: twalk_refresh
      description: |
        The long-lived half of the pair, scoped to `/api/session` and
        accepted by the refresh endpoint alone, which rotates it.
    bridgeAsToken:
      type: http
      scheme: bearer
      description: |
        The calling **bridge's** own appservice token
        (`appservice.as_token`, and `GATEWAY_BRIDGE_<ID>_AS_TOKEN` on this
        side), for the one endpoint a bridge calls: its status webhook
        (ticket #56). Its caller is not a browser and not the Sensor, so it
        carries neither a device cookie nor the service token, and neither
        of those opens this route. The Gateway holds this credential to
        verify pushes and for nothing else: it never acts as the appservice
        (`docs/architecture/security-model.md`).
    serviceToken:
      type: http
      scheme: bearer
      description: |
        A token from the Gateway's own configuration
        (`GATEWAY_SERVICE_TOKEN`), for a caller that is not a device and has
        no OpenID token to sign in with: the Sensor reading the consent
        snapshot, which is the one endpoint that takes it. The distinction is
        not one a client may guess at: a device cookie grants no access to a
        service-token route, and a service token grants no access to a device
        route. It is a bearer credential over the whole consent state, so an
        operator generates it (`openssl rand -hex 32`) rather than choosing
        it, and the Gateway refuses to start with one shorter than 32
        characters.

  parameters:
    bridgeId:
      name: bridge_id
      in: path
      required: true
      description: |
        The bridge instance, as `GET /api/bridges` names it — the
        `bridge_id` this deployment declared in its configuration.
      schema:
        type: string
        minLength: 1
      example: mautrix-whatsapp
    statusBridgeId:
      name: bridge_id
      in: path
      required: true
      description: |
        The bridge as the **event contract** names it: `^bridge-[a-z0-9-]+$`,
        which is what `bridge.status.changed.v1` carries as `data.bridge_id`.
        Distinct from the instance id above on purpose — that one names the
        software an operator configured, this one is the identity third
        parties code against, and it is stable across restarts.
      schema:
        type: string
        pattern: "^bridge-[a-z0-9-]+$"
      example: bridge-whatsapp

  responses:
    Unauthenticated:
      description: |
        No device token, or one that is unknown, expired or revoked — one
        answer for all three. Also what an unknown `/api` path answers to a
        caller with no device token.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    enum: [unauthenticated]
    StoreFailed:
      description: |
        The Gateway's own store (SQLite, its record of truth) failed. Not
        the client's fault and not retryable by changing the request.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    enum: [store_failed]
    SignInNotConfigured:
      description: |
        This deployment has no owner (`GATEWAY_OWNER` is unset), so nobody
        can sign in and the whole API is closed. The origin still serves the
        Companion, `/health` and `/metrics`, so the app can tell the
        operator what is missing — `detail` names the variables.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    enum: [sign_in_not_configured]

    UnknownBridge:
      description: |
        `unknown_bridge` — this deployment has no bridge with that id.
        `GET /api/bridges` lists the ones it has; a deployment whose
        operator has not enabled the bridges compose profile has none.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    enum: [unknown_bridge]
    NoBridgeLogin:
      description: |
        `no_login_in_flight` — nothing has been started on this bridge, so
        there is nothing to poll, answer or cancel. `unknown_bridge` — no
        such bridge is configured.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    enum: [no_login_in_flight, unknown_bridge]
    BridgeUnavailable:
      description: |
        The bridge itself is the problem, not the request.

        - `bridge_unreachable` — its provisioning API did not answer. The
          operator checks that the bridge is running and that its
          `provisioning.shared_secret` is the one this Gateway is configured
          with.
        - `bridge_refused` — it answered something the facade cannot use;
          `detail` carries the bridge's own error code.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    enum: [bridge_unreachable, bridge_refused]

    ConsentNotConfigured:
      description: |
        This deployment writes no consent: `GATEWAY_NATS_URL` is unset, so
        the Gateway has no bus to publish a decision on and refuses to
        record one it could not announce. The session and the origin are
        unaffected; `detail` names the variable.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    enum: [consent_not_configured]
    ContactsNotConfigured:
      description: |
        This deployment projects no pending contacts: `GATEWAY_NATS_URL` is
        unset, so the Gateway consumes no inbound stream and has no list to
        answer with. An empty list would claim that nobody has written to the
        user, which is a very different statement from "this Gateway is not
        watching"; `detail` names the variables.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    enum: [contacts_not_configured]
    ConsentStoreUnavailable:
      description: |
        The consent journal (SQLite, the record of truth for consent)
        failed. On a write, nothing was recorded and nothing was published —
        the answer is a failure precisely so that a client is never told a
        decision is stored when it is not.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    enum: [store_unavailable]

  schemas:
    Error:
      type: object
      description: |
        Every refusal the Gateway produces. `error` is the stable code a
        client branches on; the operations above enumerate which codes each
        status carries.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: The machine-readable code. Stable; never a sentence.
        detail:
          type: string
          description: |
            A human-readable explanation, for an operator reading logs. Not
            for display to the user, and never matched on.
        path:
          type: string
          description: |
            The path that matched no endpoint. Set on the `/api` catch-all's
            `404` alone.

    CreateAccountRequest:
      type: object
      description: |
        A username and a password, and deliberately nothing else: a closed
        object is what makes "no recovery key can arrive here" a property of
        the API rather than a convention (ADR 0014).
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          description: |
            The localpart of the account to create. Must be the localpart of
            this deployment's `GATEWAY_OWNER`; any other value is `403`.
        password:
          type: string
          minLength: 1
          description: |
            The password the user chose. Passed to the homeserver, which
            applies its own policy, and never stored or logged by the
            Gateway.

    CreatedAccount:
      type: object
      description: |
        The Matrix session the homeserver answered with, forwarded whole:
        what the Companion continues in the browser to generate the
        cross-signing keys and the recovery key itself (ADR 0014). The
        Gateway keeps none of it.
      required: [user_id, device_id, access_token, home_server]
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: The Matrix ID of the account that was created.
        device_id:
          type: string
          description: |
            The device the session belongs to. The browser's crypto store is
            bound to it.
        access_token:
          type: string
          description: |
            The account's Matrix access token. Returned because the browser
            needs a session, and held nowhere: not in the Gateway's store,
            not in a log line (ADR 0011).
        home_server:
          type: string
          description: The homeserver name, as the homeserver reports it.

    InviteSensorRequest:
      type: object
      description: |
        The user's Matrix access token and the rooms they selected. Closed,
        for the same reason as the registration request.
      required: [matrix_access_token, rooms]
      additionalProperties: false
      properties:
        matrix_access_token:
          type: string
          minLength: 1
          description: |
            The user's own Matrix access token — the session that is in the
            rooms and can therefore invite. Used for these calls and
            forgotten: never stored, never logged.
        rooms:
          type: array
          description: |
            The rooms the user selected, as Matrix room ids
            (`!opaque:server`). An empty list is allowed and does nothing.
          items:
            type: string
          maxItems: 64

    SensorInvitation:
      type: object
      description: One outcome per room asked about, in the order asked.
      required: [sensor, rooms]
      additionalProperties: false
      properties:
        sensor:
          type: [string, "null"]
          description: |
            The Matrix ID the Gateway invited (`GATEWAY_SENSOR_USER_ID`), so
            the Companion can name it on screen rather than guess it.
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/RoomInvitation"

    RoomInvitation:
      type: object
      description: What happened in one room the user selected.
      required: [room_id, status]
      additionalProperties: false
      properties:
        room_id:
          type: string
          description: The room, exactly as the request spelled it.
        status:
          type: string
          enum: [invited, already_present, failed]
          description: |
            `invited` — the Sensor was invited and will join on its own.
            `already_present` — it is already in the room, or already
            invited to it; asking twice is not an error.
            `failed` — this room alone did not work; `reason` says why.
        reason:
          type: string
          description: |
            Present on `failed` alone: the homeserver's own error code
            (`M_FORBIDDEN` where the user may not invite in that room), or
            the Gateway's (`invalid_room_id` for a string that is not a
            room id at all).

    HomeserverRefusal:
      type: object
      description: |
        The homeserver would not do what the Gateway relayed, or could not
        be reached. Carries the homeserver's own error code where there was
        one, so a client can turn a password policy into a message instead
        of a shrug.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [homeserver_refused, homeserver_unreachable]
        detail:
          type: string
          description: |
            A human-readable explanation, for an operator reading logs. Not
            for display to the user, and never matched on.
        matrix_errcode:
          type: string
          description: |
            The homeserver's `errcode` (`M_USER_IN_USE`,
            `M_PASSWORD_TOO_SHORT`, …), on `homeserver_refused`. The
            homeserver's human-readable message is deliberately not
            forwarded: it goes to the Gateway's log, where an operator reads
            it.

    Health:
      type: object
      required: [status, version, revision]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
          description: |
            `ok` while the process answers. Liveness, not readiness.
        version:
          type: string
          minLength: 1
          description: |
            The Gateway's version — the same value as this description's
            `info.version`. The Companion compares it with the version baked
            into its own build and reloads on a mismatch.
        revision:
          type: string
          minLength: 1
          description: |
            The revision the binary was built from, or `unknown`.
            Provenance, not part of the handshake.

    SignInRequest:
      type: object
      required: [matrix_openid_token]
      additionalProperties: false
      properties:
        matrix_openid_token:
          $ref: "#/components/schemas/MatrixOpenIdToken"
        device_name:
          type: string
          description: |
            How this device should appear in the device list — the user's
            own words ("Pixel 8", "the laptop"). Optional; the Gateway names
            an unnamed device itself.

    MatrixOpenIdToken:
      type: object
      description: |
        The homeserver's OpenID token document, forwarded unchanged. The
        Gateway reads `access_token` and `matrix_server_name`; the rest of
        the homeserver's answer (`token_type`, `expires_in`) is accepted and
        ignored, so a client can forward the document as it received it.
      required: [access_token]
      properties:
        access_token:
          type: string
          description: |
            The OpenID token itself. Not a Matrix access token: it proves an
            identity to a third party and nothing more.
        matrix_server_name:
          type: string
          description: |
            The homeserver that minted the token. Checked against this
            deployment's homeserver before any outbound call; absent, the
            Gateway asks its own homeserver, the only one it would ask.

    Session:
      type: object
      description: Who is signed in, on which device.
      required: [owner, homeserver, device]
      additionalProperties: false
      properties:
        owner:
          type: string
          description: |
            The Matrix ID of the single human this deployment serves
            (`GATEWAY_OWNER`).
        homeserver:
          type: string
          description: The homeserver name that identity belongs to.
        device:
          $ref: "#/components/schemas/Device"

    IssuedSession:
      type: object
      description: |
        A session whose tokens were just issued or rotated: the session
        document plus the device token's lifetime, so the client refreshes
        on time rather than discovering the expiry as a `401`.

        Spelled out rather than an `allOf` over [`Session`]: a closed object
        (`additionalProperties: false`) is what makes the conformance test
        catch a response member nobody described, and that keyword cannot
        see through an `allOf`.
      required: [owner, homeserver, device, expires_in]
      additionalProperties: false
      properties:
        owner:
          type: string
          description: |
            The Matrix ID of the single human this deployment serves
            (`GATEWAY_OWNER`).
        homeserver:
          type: string
          description: The homeserver name that identity belongs to.
        device:
          $ref: "#/components/schemas/Device"
        expires_in:
          type: integer
          minimum: 1
          description: |
            Seconds the device token stays valid from now. The refresh
            token lives longer; its lifetime is not reported, because
            the client's only move when it expires is to sign in again.

    Device:
      type: object
      description: |
        One device in the list. Dates are seconds since the epoch: the
        Gateway carries no date library, and a client renders local time
        from a number as readily as from a string.
      required:
        - id
        - name
        - created_unix_seconds
        - last_seen_unix_seconds
        - revoked_unix_seconds
        - current
      additionalProperties: false
      properties:
        id:
          type: string
          description: The device's id — what `DELETE /api/devices/{id}` takes.
        name:
          type: string
          description: |
            The name the device was signed in under, or the one the Gateway
            gave it.
        created_unix_seconds:
          type: integer
          description: When this device first signed in.
        last_seen_unix_seconds:
          type: integer
          description: |
            When a request last authenticated with this device's token.
        revoked_unix_seconds:
          type: [integer, "null"]
          description: |
            When the device was revoked, or `null` while it is live. Present
            either way: an absent member would be indistinguishable from a
            client that failed to read it.
        current:
          type: boolean
          description: Whether this is the device the request came from.

    DeviceList:
      type: object
      required: [devices]
      additionalProperties: false
      properties:
        devices:
          type: array
          description: |
            Every device, revoked ones included, so that a revocation stays
            visible to the user who made it.
          items:
            $ref: "#/components/schemas/Device"

    Network:
      type: string
      description: |
        A messaging network as the user experiences it, and `matrix` for
        native rooms (ADR 0005, ADR 0009). The contract's own `network`
        enum, exactly: a bridge id (`gmessages`) is never a network.
      enum: [whatsapp, telegram, signal, discord, sms, matrix]

    ConsentState_State:
      type: string
      description: |
        The data-processing agreement state of a subject. `unset` is not one
        of them — it is the absence of a decision, and only `old_state`
        carries it.
      enum: [granted, pending, revoked]

    ConsentSubject:
      type: object
      description: Who or what a consent decision applies to.
      required: [type, id]
      additionalProperties: false
      properties:
        type:
          type: string
          description: |
            `contact` for one contact, `network` for a whole network's
            default, `persona` for a persona's own activation (ADR 0013).
          enum: [contact, network, persona]
        id:
          type: string
          maxLength: 256
          minLength: 1
          description: |
            A Matrix user ID for a contact; for a network subject, that
            network's own value — in which case the scope holds exactly that
            one network; for a persona, the persona's name (`assistant`).

    ConsentScope:
      type: object
      description: The perimeter of a decision.
      required: [networks]
      additionalProperties: false
      properties:
        networks:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Network"
          description: |
            The networks the decision applies to. Order does not matter on
            the way in: the Gateway sorts it, because the sorted scope is
            part of the event's deterministic id.

    ConsentDecisionRequest:
      type: object
      description: One decision the owner asks the Gateway to record.
      required: [subject, new_state, scope]
      additionalProperties: false
      properties:
        subject:
          $ref: "#/components/schemas/ConsentSubject"
        new_state:
          $ref: "#/components/schemas/ConsentState_State"
        scope:
          $ref: "#/components/schemas/ConsentScope"
        reason:
          type: string
          maxLength: 1024
          description: |
            Optional free text kept in the journal and published with the
            event, for the audit trail. The user's own words about their own
            decision — never message content.

    RecordedConsentDecision:
      type: object
      description: A decision as the journal holds it.
      required:
        [event_id, sequence, subject, old_state, new_state, scope, occurred_at, actor, replayed]
      additionalProperties: false
      properties:
        event_id:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: |
            The id of the `consent.state.changed.v1` event this decision is
            published as: the contract's deterministic key, the lowercase-hex
            sha256 of
            `subject.type:subject.id:new_state:<sorted networks>:occurred_at`.
            A consumer can match a bus event to this answer by it.
        sequence:
          type: integer
          minimum: 1
          description: |
            The decision's position in the journal, which is the only
            ordering the Gateway trusts. Not the bus's sequence — that is
            `decision_sequence` against `stream_sequence` in
            `GET /api/consent/snapshot`.
        subject:
          $ref: "#/components/schemas/ConsentSubject"
        old_state:
          type: string
          description: |
            What the subject held on this perimeter before, read inside the
            recording transaction from the most recent decision covering any
            of the scoped networks. `unset` means none ever did.
          enum: [unset, granted, pending, revoked]
        new_state:
          $ref: "#/components/schemas/ConsentState_State"
        scope:
          $ref: "#/components/schemas/ConsentScope"
        occurred_at:
          type: string
          format: date-time
          description: |
            When the decision was taken, stamped by the Gateway to the
            millisecond. Part of the event's id, and stored verbatim so the
            id stays reproducible.
        actor:
          type: string
          description: |
            The Matrix user ID of the owner the decision is attributed to.
            One owner per deployment (ADR 0011), so this is the human, not
            the device it arrived from.
        replayed:
          type: boolean
          description: |
            `true` when the journal already held this exact decision and
            nothing was recorded (the `200` answer).

    ConsentStateEntry:
      type: object
      description: One (subject, network) of the current state.
      required: [subject, network, state, decided_at, decision_sequence]
      additionalProperties: false
      properties:
        subject:
          $ref: "#/components/schemas/ConsentSubject"
        network:
          $ref: "#/components/schemas/Network"
        state:
          $ref: "#/components/schemas/ConsentState_State"
        decided_at:
          type: string
          format: date-time
          description: When the decision this entry comes from was taken.
        decision_sequence:
          type: integer
          minimum: 1
          description: That decision's position in the journal.

    ConsentState:
      type: object
      required: [entries]
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ConsentStateEntry"
          description: |
            Every recorded entry, ordered by subject type, subject and
            network. Not paginated, and uncapped: the cap belongs to the
            snapshot, where the entries are a consumer's whole starting
            state.

    ConsentSnapshot:
      type: object
      description: |
        The whole consent state, and the bus position it reflects. The two
        are read together, so no decision can be committed and published
        between them without appearing in one of the two.
      required:
        [
          stream,
          subject,
          stream_sequence,
          next_stream_sequence,
          decision_sequence,
          entries,
        ]
      additionalProperties: false
      properties:
        stream:
          type: string
          description: |
            The JetStream stream `stream_sequence` is a sequence of — the
            deployment's one stream, `twalk`. Named here so a consumer does
            not have to agree with the Gateway about it out of band.
          example: twalk
        subject:
          type: string
          description: |
            The subject the decisions in this state were published on, which
            is what a consumer filters its stream consumer by.
          example: twalk.consent.state.changed.v1
        stream_sequence:
          type: integer
          minimum: 0
          description: |
            The sequence of the last decision this snapshot reflects, as the
            bus stored it. `0` when no decision has reached the bus yet.
        next_stream_sequence:
          type: integer
          minimum: 1
          description: |
            `stream_sequence + 1`: where a consumer starts its stream
            consumer after applying `entries`. Spelled out rather than left
            to the client to compute, because that off-by-one would silently
            skip or re-apply one decision.
        decision_sequence:
          type: integer
          minimum: 0
          description: |
            The position in the Gateway's own decision journal this snapshot
            reflects — the same counter as a recorded decision's `sequence`.
            Not what a consumer starts from (that is the stream sequence
            above): this is for an operator comparing the two.
        entries:
          type: array
          description: |
            One entry per (subject, network), ordered by subject type,
            subject and network. Revocations are explicit; `persona`
            subjects are excluded.
          items:
            $ref: "#/components/schemas/ConsentStateEntry"

    EffectiveConsent:
      type: object
      description: The state that applies to one contact on one network.
      required: [contact, network, state, decided_by]
      additionalProperties: false
      properties:
        contact:
          type: string
          description: The contact the question was about.
        network:
          $ref: "#/components/schemas/Network"
        state:
          $ref: "#/components/schemas/ConsentState_State"
        decided_by:
          description: |
            The subject whose decision answered — the contact itself, or the
            network whose default applied — and `null` when no decision
            exists, in which case `state` is `pending`.
          oneOf:
            - $ref: "#/components/schemas/ConsentSubject"
            - type: "null"

    PendingContact:
      type: object
      description: |
        One contact waiting for a decision, on one network. Four members, and
        deliberately no fifth: a body, a display name or a network identifier
        would each turn this list into something else.
      required: [contact, network, first_seen, last_seen]
      additionalProperties: false
      properties:
        contact:
          type: string
          description: |
            The contact's Matrix user ID, as the bridge materialised it, and
            what a decision about them will name as its subject.
          example: "@whatsapp_33612345678:example.com"
        network:
          $ref: "#/components/schemas/Network"
        first_seen:
          type: string
          format: date-time
          description: |
            When this contact first wrote, from the event's own `time` - not
            when this Gateway happened to read it.
        last_seen:
          type: string
          format: date-time
          description: When this contact last wrote, on the same terms.

    PendingContactCount:
      type: object
      required: [network, count]
      additionalProperties: false
      properties:
        network:
          $ref: "#/components/schemas/Network"
        count:
          type: integer
          minimum: 1
          description: How many contacts are waiting on that network.

    PendingContacts:
      type: object
      required: [total, networks, contacts]
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
          description: |
            How many contacts are waiting for a decision in all - the
            dashboard's number. Counts the whole list, never only what a
            `?network=` filter left in `contacts`.
        networks:
          type: array
          description: |
            The same total, broken down per network, in the contract's own
            order of network values. A network with nothing waiting is absent
            rather than present at zero.
          items:
            $ref: "#/components/schemas/PendingContactCount"
        contacts:
          type: array
          description: |
            The contacts themselves, oldest first sighting first - the order
            the user met them in, and stable between polls. Narrowed by
            `?network=` when one was given.
          items:
            $ref: "#/components/schemas/PendingContact"

    ContactDisplayName:
      type: object
      required: [contact, display_name]
      additionalProperties: false
      properties:
        contact:
          type: string
          description: The contact asked about.
        display_name:
          description: |
            What the bus's most recent event says this contact is called, or
            `null` when the read found none. Never stored by the Gateway.
          oneOf:
            - type: string
            - type: "null"

    ContactDisplayNames:
      type: object
      required: [contacts]
      additionalProperties: false
      properties:
        contacts:
          type: array
          description: One entry per distinct contact asked about, in order.
          items:
            $ref: "#/components/schemas/ContactDisplayName"

    BridgeList:
      type: object
      required: [bridges]
      additionalProperties: false
      properties:
        bridges:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredBridge"

    ConfiguredBridge:
      type: object
      required: [bridge_id, network, login]
      additionalProperties: false
      properties:
        bridge_id:
          type: string
          description: |
            The bridge instance's id, as this deployment's configuration
            declares it (`mautrix-whatsapp`). It identifies the
            implementation, never the network (CONTEXT.md), and it is what
            every other path below takes.
        network:
          type: string
          description: |
            The network the user experiences — `whatsapp`, `signal`, `sms` —
            which is what the Companion labels the screen with. Configured
            per instance, because a bridge's name and its network are not the
            same thing: `mautrix-gmessages` is the `sms` network.
        login:
          description: |
            The login this bridge has in flight, or `null` when nothing has
            been started on it. A login that completed, failed or was
            cancelled is still reported here until the next one replaces it.
          oneOf:
            - $ref: "#/components/schemas/BridgeLogin"
            - type: "null"

    BridgeStatePush:
      type: object
      required: [state_event]
      # Open on purpose: this is mautrix's own document, not the Gateway's,
      # and an upstream that adds a member must not make a push invalid.
      additionalProperties: true
      properties:
        state_event:
          type: string
          description: |
            The state the bridge is reporting. Mautrix declares seven;
            anything else is read as `disconnected`, because telling a
            dashboard that an unrecognised state is fine is the one wrong
            direction.
          enum:
            - CONNECTING
            - BACKFILLING
            - CONNECTED
            - TRANSIENT_DISCONNECT
            - BAD_CREDENTIALS
            - UNKNOWN_ERROR
            - LOGGED_OUT
        message:
          type: string
          description: |
            The bridge's own human-readable cause, which becomes the event's
            `reason` (truncated to the contract's 1024 characters).
        error:
          type: string
          description: |
            The bridge's error code. Used as `reason` when there is no
            `message`: a code is a worse sentence than a message and a much
            better one than nothing.
        timestamp:
          type: integer
          description: |
            When the state changed, in whole seconds since the epoch — the
            instant of the last *change*, not of this push. It becomes the
            event's `occurred_at`, and therefore part of its deterministic
            id. Absent: the Gateway's own clock is used.
        user_action:
          type: string
          description: |
            What the bridge thinks the user has to do. Logged by the Gateway
            and not published: `bridge.status.changed.v1` has no field for
            it, and a producer inventing one would be a contract change.
          enum: [OPEN_NATIVE, RELOGIN, RESTART]
        info:
          type: [object, "null"]
          additionalProperties: true
          description: |
            Mautrix's free-form map. `last_message_at` (or
            `last_message_ts`) is read out of it into the event's
            `last_message_at` when a bridge puts one there; none does today.

    BridgeLoginFlows:
      type: object
      required: [flows]
      additionalProperties: false
      properties:
        flows:
          type: array
          items:
            type: object
            required: [id, name, description]
            additionalProperties: false
            properties:
              id:
                type: string
                description: What `POST .../login` takes as `flow_id`.
              name:
                type: string
                description: The bridge's own label for the flow.
              description:
                type: [string, "null"]
                description: The bridge's longer explanation, when it gives one.

    BridgeLogins:
      type: object
      required: [logins]
      additionalProperties: false
      properties:
        logins:
          type: array
          items:
            type: object
            required: [login_id, name, profile]
            additionalProperties: false
            properties:
              login_id:
                type: string
                description: |
                  What `POST .../login` takes as `login_id` to reconnect, and
                  what `DELETE .../logins/{login_id}` drops.
              name:
                type: [string, "null"]
                description: The name the network gives the account.
              profile:
                description: |
                  The bridge's own profile object for the login, passed
                  through unread — its shape is the bridge's and the network's.

    StartBridgeLoginRequest:
      type: object
      description: |
        A flow to run, and optionally the login to repair. Closed: the acting
        user is the deployment's owner, from configuration, and no request
        can name somebody else.
      required: [flow_id]
      additionalProperties: false
      properties:
        flow_id:
          type: string
          minLength: 1
          description: One of the ids `GET .../login/flows` lists.
        login_id:
          type: string
          minLength: 1
          description: |
            Reconnect: re-log in to this existing login instead of creating a
            second one. This is what repairs a broken session.

    SubmitBridgeLoginStepRequest:
      type: object
      required: [step_id, data]
      additionalProperties: false
      properties:
        step_id:
          type: string
          minLength: 1
          description: |
            The step being answered — the `step.step_id` the polled state
            reports. A different one is refused rather than guessed at.
        data:
          type: object
          additionalProperties: true
          description: |
            What the step's own payload asked for, passed to the bridge
            untouched: `{"phone_number": "+33…"}` for a `user_input` step,
            `{"cookies": {…}}` for a `cookies` one. A network credential — it
            is relayed and forgotten, never stored and never logged
            (ADR 0011).

    BridgeLogin:
      type: object
      description: |
        The whole state of one login, and the document the Companion polls.
        Watch `state` and `generation`; everything else is what to draw.
      required:
        [
          bridge_id,
          network,
          process_id,
          flow_id,
          login_id,
          state,
          started_at,
          started_by,
          expires_at,
          generation,
          step,
          login,
          error,
        ]
      additionalProperties: false
      properties:
        bridge_id:
          type: string
        network:
          type: string
        process_id:
          type: string
          description: |
            The bridge's own id for this login process. It lives in the
            bridge's memory and does not survive its restart.
        flow_id:
          type: string
        login_id:
          type: [string, "null"]
          description: |
            The existing login this flow is repairing, when it is a
            reconnect; `null` for a first login.
        state:
          type: string
          enum: [awaiting_input, awaiting_remote, complete, failed, cancelled]
          description: |
            - `awaiting_input` — the step needs something from the user;
              submit it.
            - `awaiting_remote` — the Gateway is holding the blocking step
              and the user is scanning. Keep polling; there is nothing to
              send.
            - `complete` — the network accepted the login, and `login` names
              it.
            - `failed` — `error` says why.
            - `cancelled` — this device, or the remote side, stopped it.
        started_at:
          type: string
          format: date-time
          description: When this login was started, to the millisecond.
        started_by:
          type: object
          required: [device_id, device_name]
          additionalProperties: false
          description: |
            The device that started it. One owner per deployment, so this
            says *which of my devices*, never *who*.
          properties:
            device_id:
              type: string
            device_name:
              type: string
        expires_at:
          type: string
          format: date-time
          description: |
            The bridge's own deadline for the process: bridgev2 caps a login
            at 30 minutes. Past it the login is gone whatever this document
            last said.
        generation:
          type: integer
          minimum: 0
          description: |
            Increments on every step the bridge hands back, **refreshes
            included**. A changed generation with the same `step.step_id` is
            a refreshed QR code: redraw it. This, not a timer, is the signal
            that a fresh code has arrived.
        step:
          description: |
            The step to render, or `null` once the login is over.
          oneOf:
            - $ref: "#/components/schemas/BridgeLoginStep"
            - type: "null"
        login:
          description: The login the network accepted; `null` until `complete`.
          oneOf:
            - type: object
              required: [login_id, user_id]
              additionalProperties: false
              properties:
                login_id:
                  type: string
                  description: |
                    What `DELETE .../logins/{login_id}` drops, and what a
                    later reconnect names.
                user_id:
                  type: [string, "null"]
                  description: The bridge's user-login id, when it names one.
            - type: "null"
        error:
          description: Why the login failed; `null` unless `state` is `failed`.
          oneOf:
            - type: object
              required: [code, detail]
              additionalProperties: false
              properties:
                code:
                  type: string
                  enum:
                    [
                      login_lost,
                      login_expired,
                      webauthn_required,
                      unsupported_step,
                      bridge_refused,
                      bridge_unreachable,
                    ]
                  description: |
                    - `login_lost` — the bridge stopped answering, or no
                      longer knows the process. **A login in flight does not
                      survive a restart of the bridge or of the Gateway**:
                      nothing about it is persisted on either side. Start
                      again.
                    - `login_expired` — the bridge ended it: cancelled, timed
                      out, or already finished.
                    - `webauthn_required` — the flow asked for a passkey,
                      which the Companion cannot drive. The login fails here
                      rather than hanging on a step nobody will answer; a
                      bridge with `provisioning.fail_on_webauthn` refuses it
                      one step earlier.
                    - `unsupported_step` — a step type this facade does not
                      drive (`client_http`).
                    - `bridge_refused` / `bridge_unreachable` — the bridge
                      answered something unusable, or nothing at all.
                detail:
                  type: [string, "null"]
                  description: |
                    For an operator's logs. Not for display, and never
                    matched on.
            - type: "null"

    BridgeLoginStep:
      type: object
      required:
        [step_id, type, instructions, payload, received_at, valid_for_seconds, expires_at]
      additionalProperties: false
      properties:
        step_id:
          type: string
          description: |
            The bridge's id for this step. `POST .../login/submit` is
            answered against exactly this value.
        type:
          type: string
          enum: [user_input, cookies, display_and_wait, client_http, webauthn, complete]
          description: |
            bridgev2's own step types. `display_and_wait` is the blocking one
            — the Gateway is holding it, and the browser only polls;
            `user_input` and `cookies` are the ones to submit. `client_http`
            and `webauthn` never appear here: they fail the login instead
            (see `error.code`).
        instructions:
          type: [string, "null"]
          description: |
            The bridge's own words for the user, when it gives any. Show them
            rather than inventing copy: they are the network's wording for
            where to find the "link a device" screen.
        payload:
          description: |
            The step's payload, **passed through from the bridge**. For a QR
            step it is `{"type": "qr", "data": "…"}`, and `data` is the raw
            payload the browser draws: the bridge renders no image. For
            `user_input` it is the field list to render; for `cookies`, the
            URL and the cookies to collect.

            Its shape is the bridge's, not the Gateway's, which is why it is
            not constrained here. It is also a network credential in flight:
            it is held nowhere else and is gone as soon as the next step
            replaces it.
          type: [object, "null"]
          additionalProperties: true
        received_at:
          type: string
          format: date-time
          description: When the bridge handed this step over.
        valid_for_seconds:
          type: integer
          minimum: 0
          description: |
            How long this step is worth acting on, from `received_at`. For a
            QR code it is the Gateway's own estimate of the network's refresh
            interval — the bridge states no expiry, and WhatsApp's whole QR
            budget is about 2m40 across refreshes — so treat it as "redraw
            soon" and `generation` as the fact. Never past `expires_at` of
            the login itself.
        expires_at:
          type: string
          format: date-time
          description: "`received_at` plus `valid_for_seconds`."
