# Reference-deployment Synapse configuration. This file is a Jinja2 template:
# the synapse image's `migrate_config` entrypoint renders it into
# /data/homeserver.yaml with the container environment (see the synapse-config
# service in ../compose.yaml). Secrets come from the .env file through the
# environment — nothing secret is hardcoded here.

server_name: "{{ MATRIX_DOMAIN }}"
pid_file: /data/homeserver.pid
report_stats: false

listeners:
  # Client API only. The reference stack does not federate: a personal hub
  # talks to its own users and to local bridges, and exposing the federation
  # resource would serve no purpose.
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

# Rendered from the image's default template by the synapse-config service.
log_config: "/data/log.config"
media_store_path: /data/media_store

# Generated by the synapse-config service on first start if absent (kept in
# the named volume).
signing_key_path: "/data/signing.key"
trusted_key_servers: []

macaroon_secret_key: "{{ MATRIX_MACAROON_SECRET }}"
form_secret: "{{ MATRIX_FORM_SECRET }}"
registration_shared_secret: "{{ MATRIX_REGISTRATION_SHARED_SECRET }}"

# No open registration on the reference deployment (the test stack's
# enable_registration is test-only): accounts are provisioned by an operator
# with register_new_matrix_user, which authenticates with the registration
# shared secret above — see ../provision.sh.
