# Twalk reference deployment: Synapse (the Matrix hub), NATS JetStream (the
# bus), the Sensor and the Companion Gateway, wired together with named
# volumes and configured only through the environment file — copy
# .env.example to .env and edit it first.
#
#   docker compose up -d --wait
#
# The provision one-shot creates the Sensor account on the way up;
# ./provision.sh remains for ad-hoc account creation from the host.
#
# The mautrix bridges are off by default, behind the `bridges` compose
# profile: an operator who does not want them pulls no bridge image, runs no
# bridge container and sets no bridge variable. Enabling them is two steps and
# not one, because installing an appservice registration means editing the
# homeserver's configuration and restarting it — there is no runtime API for
# it (see ../README.md and ./provision-bridges.sh):
#
#   ./provision-bridges.sh                      # registrations, then Synapse
#   docker compose --profile bridges up -d --wait
#
# Running only the second is a loud failure, not a subtle one — ../README.md
# names both shapes it takes.
#
# Hermes and the other planes join this stack as they land (see the repository
# roadmap).

name: twalk

services:
  # One-shot: renders /data/homeserver.yaml from the Jinja2 template in
  # ./synapse with the environment below (the image's `migrate_config` mode),
  # generates the signing key on first start and fixes /data ownership, then
  # exits. Re-rendered whenever the environment changes.
  synapse-config:
    image: matrixdotorg/synapse:v1.161.0
    command: ["migrate_config"]
    environment:
      # start.py requires these two even though the template reads the
      # MATRIX_* variables directly.
      SYNAPSE_SERVER_NAME: ${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}
      SYNAPSE_REPORT_STATS: "no"
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:?set MATRIX_REGISTRATION_SHARED_SECRET in .env}
      MATRIX_MACAROON_SECRET: ${MATRIX_MACAROON_SECRET:?set MATRIX_MACAROON_SECRET in .env}
      MATRIX_FORM_SECRET: ${MATRIX_FORM_SECRET:?set MATRIX_FORM_SECRET in .env}
      # start.py persists these two to key files in /data when unset; the
      # rendered config uses the MATRIX_* values, so pin them to the same
      # secrets to avoid generating unused files.
      SYNAPSE_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:?set MATRIX_REGISTRATION_SHARED_SECRET in .env}
      SYNAPSE_MACAROON_SECRET_KEY: ${MATRIX_MACAROON_SECRET:?set MATRIX_MACAROON_SECRET in .env}
      # Comma-separated appservice registration paths, as Synapse reads them
      # from the bridge-registrations volume. Empty (the default): no
      # `app_service_config_files` at all, which is what the stack without
      # bridges needs — Synapse refuses to start on a path that does not
      # exist yet, so this stays the operator's explicit opt-in and
      # ./provision-bridges.sh checks it before generating anything.
      MATRIX_APPSERVICE_REGISTRATIONS: ${MATRIX_APPSERVICE_REGISTRATIONS:-}
    volumes:
      - ./synapse/homeserver.yaml:/conf/homeserver.yaml:ro
      - synapse-data:/data

  synapse:
    image: matrixdotorg/synapse:v1.161.0
    depends_on:
      synapse-config:
        condition: service_completed_successfully
    volumes:
      # Database, media store and signing key.
      - synapse-data:/data
      # The bridges' appservice registrations, generated at provisioning
      # time (./provision-bridges.sh) and read here — read-only, because the
      # homeserver is their consumer and never their author. Mounted
      # unconditionally: an empty volume costs nothing, and the paths inside
      # it only reach Synapse's configuration through
      # MATRIX_APPSERVICE_REGISTRATIONS above.
      - bridge-registrations:/registrations:ro
    ports:
      # Localhost only by default: in production the client API is fronted
      # by the operator's TLS reverse proxy on the same host (which is what
      # x_forwarded in the Synapse config is for).
      - "127.0.0.1:${MATRIX_HTTP_PORT:-8008}:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  # One-shot: creates the Sensor account once Synapse is healthy, so a fresh
  # `docker compose up` is the whole setup — no manual provisioning step.
  # Open registration stays off; this authenticates with the registration
  # shared secret from the rendered config, like provision.sh does from the
  # host. Idempotent: an existing account is skipped.
  provision:
    image: matrixdotorg/synapse:v1.161.0
    depends_on:
      synapse:
        condition: service_healthy
    environment:
      SENSOR_USER_ID: ${SENSOR_USER_ID:?set SENSOR_USER_ID in .env}
      SENSOR_PASSWORD: ${SENSOR_PASSWORD:?set SENSOR_PASSWORD in .env}
    volumes:
      # Read-only: register_new_matrix_user only reads the registration
      # shared secret from the rendered config.
      - synapse-data:/data:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        localpart="$${SENSOR_USER_ID#@}"; localpart="$${localpart%%:*}"
        output=$$(register_new_matrix_user -u "$$localpart" -p "$$SENSOR_PASSWORD" --no-admin \
          -c /data/homeserver.yaml http://synapse:8008 2>&1) \
          && { echo "provisioned $$localpart"; exit 0; }
        echo "$$output" >&2
        echo "$$output" | grep -qi "already" && exit 0
        exit 1
    # Tolerate early boot races the same way the sensor does.
    restart: on-failure

  nats:
    image: nats:2
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    ports:
      # Localhost only: the bus has no authentication in this reference
      # stack, so it must not be reachable from the network. Host-side
      # consumers (Hermes, replay tools) use this port.
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
    # No healthcheck: the nats image ships no shell, wget or CLI to probe
    # with. The sensor service below retries its way in instead.
    restart: unless-stopped

  sensor:
    build:
      # The repository root: the sensor crate declares the shared test
      # harness (tests/harness/) as a dev dependency, and cargo needs every
      # path dependency present to resolve the graph at all. See
      # sensor.Dockerfile.
      context: ../..
      # Resolved from the build context.
      dockerfile: deploy/docker-compose/sensor.Dockerfile
    # Name the local build is tagged with, and the image the service runs.
    # Overridable (issue #38) so that several stacks built from different
    # checkouts on one Docker daemon — the deployment test in parallel
    # worktrees — never overwrite each other's image.
    image: ${TWALK_SENSOR_IMAGE:-twalk/sensor:local}
    depends_on:
      synapse:
        condition: service_healthy
      nats:
        condition: service_started
      # Starts only once its account exists; the restart policy below stays
      # as the safety net for a skipped or failed provisioning.
      provision:
        condition: service_completed_successfully
    environment:
      SENSOR_HOMESERVER: http://synapse:8008
      SENSOR_NATS_URL: nats://nats:4222
      SENSOR_USER_ID: ${SENSOR_USER_ID:?set SENSOR_USER_ID in .env}
      SENSOR_PASSWORD: ${SENSOR_PASSWORD:?set SENSOR_PASSWORD in .env}
      SENSOR_ALLOWED_INVITERS: ${SENSOR_ALLOWED_INVITERS:?set SENSOR_ALLOWED_INVITERS in .env}
      SENSOR_STATE_DIR: ${SENSOR_STATE_DIR:-/data}
      SENSOR_LOG_LEVEL: ${SENSOR_LOG_LEVEL:-info}
      SENSOR_METRICS_LISTEN: ${SENSOR_METRICS_LISTEN:-}
      SENSOR_RECOVERY_KEY: ${SENSOR_RECOVERY_KEY:-}
      # The consent snapshot (ticket #51, ADR 0010): where the Sensor reads
      # the whole consent state at startup, and the token it reads it with.
      # Both derive from the one secret GATEWAY_SERVICE_TOKEN, so setting that
      # lights up both halves of the same hand-off: the Gateway serves the
      # snapshot, and the Sensor reads it from this stack's own Gateway.
      # Leaving it empty leaves these empty too — no snapshot, a cold consent
      # cache on every restart (issue #16), and inbound events unaffected.
      # Override either one to read a snapshot from a Gateway that is not
      # this stack's; setting one without the other is refused on startup.
      SENSOR_GATEWAY_URL: ${SENSOR_GATEWAY_URL:-${GATEWAY_SERVICE_TOKEN:+http://companion-gateway:8080}}
      SENSOR_GATEWAY_SERVICE_TOKEN: ${SENSOR_GATEWAY_SERVICE_TOKEN:-${GATEWAY_SERVICE_TOKEN:-}}
    volumes:
      # Session, sync token and crypto store: a restart resumes the sync
      # instead of re-syncing (and re-emitting) recent traffic.
      - sensor-data:/data
    # The sensor exits on an unreachable homeserver or bus and on a missing
    # account (should provisioning have been skipped or failed); compose
    # restarts it until both are there.
    restart: unless-stopped

  # The Companion Gateway: the origin that serves the Companion PWA, the
  # user's session, and the single writer of consent state (ADR 0006). It
  # needs no homeserver to come up — it talks to one only while somebody is
  # signing in — and it publishes its consent decisions on the bus below.
  companion-gateway:
    build:
      # The repository root, for the same reason as the sensor's: cargo needs
      # every path dependency present to resolve the graph at all. See
      # companion-gateway.Dockerfile.
      context: ../..
      dockerfile: deploy/docker-compose/companion-gateway.Dockerfile
    # Name the local build is tagged with, and the image the service runs.
    # Overridable (issue #38) so that several stacks built from different
    # checkouts on one Docker daemon never overwrite each other's image.
    image: ${TWALK_GATEWAY_IMAGE:-twalk/companion-gateway:local}
    depends_on:
      # Where the consent outbox publishes each committed decision. Not a
      # hard dependency inside the Gateway — a decision commits and waits in
      # the outbox while the bus is away — but in this stack the bus is right
      # there, so there is no reason to start without it.
      nats:
        condition: service_started
    environment:
      # The container-internal origin; the host-side port is published below.
      GATEWAY_LISTEN: 0.0.0.0:8080
      # The Companion's static files. The image ships them at /srv/companion;
      # point this elsewhere (with a matching volume below) to serve your own
      # build.
      GATEWAY_STATIC_DIR: ${GATEWAY_STATIC_DIR:-/srv/companion}
      # The Companion's SPA fallback file: what a client-side route (a deep
      # link reloaded cold) is served with.
      GATEWAY_FALLBACK_FILE: ${GATEWAY_FALLBACK_FILE:-200.html}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      # The single human this deployment serves, as a full Matrix ID
      # (ADR 0011). Sign-in verifies the Companion's OpenID token at the
      # homeserver and refuses every other identity. Left empty, nobody can
      # sign in: the origin still serves the Companion and every /api
      # endpoint answers 503 — deliberately, so that an operator who has not
      # set it yet keeps the page that can say so.
      GATEWAY_OWNER: ${GATEWAY_OWNER:-}
      # Where the Gateway verifies an OpenID token: the homeserver's own
      # federation API, on this compose network. Pinned rather than resolved
      # from the server name — one deployment, one homeserver.
      GATEWAY_HOMESERVER_FEDERATION_URL: ${GATEWAY_HOMESERVER_FEDERATION_URL:-http://synapse:8008}
      # Where the Gateway keeps its SQLite stores: the session store and the
      # consent decision journal. Must stay on the gateway-data volume
      # mounted below — the journal is the record of truth for consent.
      GATEWAY_STATE_DIR: ${GATEWAY_STATE_DIR:-/data}
      # The bus the consent outbox publishes each committed decision on.
      # Fixed to this stack's own bus, as the Sensor's URL is: a deployment
      # has one bus, and pointing the Gateway at another would split the
      # audit trail from the events the Sensor labels by.
      GATEWAY_NATS_URL: nats://nats:4222
      # Session lifetimes in seconds; empty means the Gateway's defaults
      # (15 minutes for a device token, 30 days for its refresh token).
      GATEWAY_DEVICE_TOKEN_TTL: ${GATEWAY_DEVICE_TOKEN_TTL:-}
      GATEWAY_REFRESH_TOKEN_TTL: ${GATEWAY_REFRESH_TOKEN_TTL:-}
      # The homeserver's client API, where the Gateway relays account
      # registration and sends the Sensor's invitations. Empty: the federation
      # URL above is used, which is the same host and port in this stack.
      GATEWAY_HOMESERVER_URL: ${GATEWAY_HOMESERVER_URL:-}
      # Bootstrap (ticket #53). Left empty, both halves are off and their
      # endpoints answer 503 naming the variable that would open them.
      #
      # The registration shared secret lets the Gateway create ONE account —
      # the owner's above, once — while Synapse's own open registration stays
      # off. Set it to the same value as MATRIX_REGISTRATION_SHARED_SECRET to
      # let the Companion's screen 2 create that account; leave it empty if you
      # provisioned the account yourself with ./provision.sh.
      GATEWAY_REGISTRATION_SHARED_SECRET: ${GATEWAY_REGISTRATION_SHARED_SECRET:-}
      # Who the Gateway invites into the rooms the user selects: the Sensor's
      # own account, the same value as SENSOR_USER_ID. The Sensor's account
      # stays provisioned by the provision one-shot above — this is who to
      # invite, never how to create it.
      GATEWAY_SENSOR_USER_ID: ${GATEWAY_SENSOR_USER_ID:-${SENSOR_USER_ID:-}}
      # The bridge login facade (ticket #55): which bridges the Companion can
      # connect a network through, and how the Gateway reaches each one's
      # provisioning API. Listed by bridge_id; each id then names its own
      # three variables below.
      #
      # This is deliberately not tied to the `bridges` compose profile:
      # compose has no way to vary a variable by profile, so an operator who
      # runs no bridge leaves GATEWAY_BRIDGES empty and GET /api/bridges
      # answers an empty list. Set it when you enable the profile.
      GATEWAY_BRIDGES: ${GATEWAY_BRIDGES:-}
      # Where the bridge's provisioning API is: its own appservice listener
      # on this compose network, not the homeserver. No published port is
      # needed — the Gateway is inside the network.
      GATEWAY_BRIDGE_MAUTRIX_WHATSAPP_URL: ${GATEWAY_BRIDGE_MAUTRIX_WHATSAPP_URL:-http://bridge-whatsapp:29318}
      # The same value as that bridge's provisioning.shared_secret, which
      # ./provision-bridges.sh renders from WHATSAPP_PROVISIONING_SECRET. It
      # starts and destroys that bridge's logins: the most powerful thing
      # this facade holds, which is why the browser never talks to a bridge
      # directly (docs/architecture/security-model.md).
      GATEWAY_BRIDGE_MAUTRIX_WHATSAPP_PROVISIONING_SECRET: ${WHATSAPP_PROVISIONING_SECRET:-}
      # The network the user experiences, which is what the Companion labels
      # the screen with — never the bridge's name (CONTEXT.md).
      GATEWAY_BRIDGE_MAUTRIX_WHATSAPP_NETWORK: whatsapp
      GATEWAY_BRIDGE_MAUTRIX_SIGNAL_URL: ${GATEWAY_BRIDGE_MAUTRIX_SIGNAL_URL:-http://bridge-signal:29328}
      GATEWAY_BRIDGE_MAUTRIX_SIGNAL_PROVISIONING_SECRET: ${SIGNAL_PROVISIONING_SECRET:-}
      GATEWAY_BRIDGE_MAUTRIX_SIGNAL_NETWORK: signal
      # The consent snapshot (ticket #50): the token a consumer reads
      # GET /api/consent/snapshot with — the whole consent state and the bus
      # sequence it reflects, which is how a component with a cold cache
      # recovers consent (ADR 0010). Its caller is a service and not a
      # browser, so it is a token in configuration and not a sign-in. Empty:
      # the endpoint answers 503 and nothing else changes.
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-}
      # The largest snapshot this Gateway serves, in (subject, network)
      # entries; empty means its default. There is no pagination — a state
      # over the cap is an error naming this variable, never a truncation.
      GATEWAY_CONSENT_SNAPSHOT_MAX_ENTRIES: ${GATEWAY_CONSENT_SNAPSHOT_MAX_ENTRIES:-}
    volumes:
      # The device list and the session tokens' digests — a restart keeps the
      # user signed in on every device they signed in on — and the consent
      # decision journal, which outlives every container by design.
      - gateway-data:/data
    #   # Serve a Companion build from the host instead of the image's.
    #   - ${GATEWAY_STATIC_SOURCE:-./companion}:/srv/companion:ro
    # No depends_on the homeserver: the Gateway talks to it only while
    # somebody is signing in, and the Companion's origin must come up even
    # when the homeserver is down — that is when the user most needs a page
    # that explains itself.
    ports:
      # Localhost only by default: in production the Companion's origin is
      # fronted by the operator's TLS reverse proxy on the same host. The
      # health and metrics endpoints live on this same origin — block
      # /metrics at the proxy if it should not be public.
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # --- Bridges: mautrix-whatsapp and mautrix-signal ------------------------
  #
  # All four services below carry `profiles: [bridges]`, so a plain
  # `docker compose up` ignores them entirely. Their variables all have empty
  # defaults for the same reason: compose interpolates the whole file whatever
  # the active profiles are, and a stack without bridges must not be asked for
  # a bridge token. The missing-value errors therefore come from
  # ../../bridges/generate-registration.sh, which can say what is missing and
  # why, rather than from interpolation.
  #
  # Image versions are pinned. A bridge holds the user's account on an
  # external network (docs/architecture/security-model.md): its version is not
  # something a `docker compose pull` should change underneath a working
  # login.

  # One-shot: renders the bridge's configuration from ../../bridges/
  # mautrix-whatsapp/config.yaml plus the environment, and generates the
  # appservice registration into the shared bridge-registrations volume. Runs
  # as root because it writes that shared volume and then hands the bridge's
  # own data directory back to the unprivileged bridge user.
  #
  # It is also what ./provision-bridges.sh runs, before Synapse ever starts —
  # generating a registration needs no homeserver, which is precisely why this
  # is provisioning-time work and not something the running bridge can do.
  bridge-whatsapp-registration:
    profiles: [bridges]
    image: dock.mau.dev/mautrix/whatsapp:v26.09
    user: "0:0"
    environment:
      BRIDGE_NETWORK: whatsapp
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}
      MATRIX_INTERNAL_URL: ${MATRIX_INTERNAL_URL:-http://synapse:8008}
      # The single owner whose login this bridge accepts. Defaults to
      # GATEWAY_OWNER: it is the same human, and one deployment has one
      # (ADR 0011).
      MATRIX_OWNER_USER_ID: ${MATRIX_OWNER_USER_ID:-${GATEWAY_OWNER:-}}
      BRIDGE_AS_TOKEN: ${WHATSAPP_AS_TOKEN:-}
      BRIDGE_HS_TOKEN: ${WHATSAPP_HS_TOKEN:-}
      BRIDGE_PROVISIONING_SECRET: ${WHATSAPP_PROVISIONING_SECRET:-}
      BRIDGE_STATUS_ENDPOINT: ${WHATSAPP_STATUS_ENDPOINT:-}
      # The image's own UID/GID, under names bash does not already own.
      BRIDGE_UID: "1337"
      BRIDGE_GID: "1337"
    volumes:
      - ../../bridges/generate-registration.sh:/opt/twalk/generate-registration.sh:ro
      - ../../bridges/mautrix-whatsapp/config.yaml:/opt/twalk/config.yaml:ro
      - whatsapp-data:/data
      - bridge-registrations:/registrations
    entrypoint: ["/usr/bin/env", "bash", "/opt/twalk/generate-registration.sh"]

  bridge-whatsapp:
    profiles: [bridges]
    image: dock.mau.dev/mautrix/whatsapp:v26.09
    depends_on:
      # The bridge asserts its own registration against the homeserver on
      # startup and exits if Synapse does not know its as_token — so Synapse
      # has to be up, and its configuration has to name the registration
      # already. That second half is ./provision-bridges.sh's job and cannot
      # be a compose dependency; a bridge left crash-looping with
      # "appservice not found" in its log is the symptom of skipping it.
      synapse:
        condition: service_healthy
      bridge-whatsapp-registration:
        condition: service_completed_successfully
    volumes:
      # Rendered config, SQLite database, and the WhatsApp session once a
      # human has scanned the QR code.
      - whatsapp-data:/data
    ports:
      # Localhost only: this port carries the appservice listener, and with
      # it the provisioning API (`/_matrix/provision/v3/*`) whose bearer
      # token starts and destroys logins. Inside the stack the Companion
      # Gateway reaches it as http://bridge-whatsapp:29318 with no published
      # port at all; this mapping exists so that an operator (and the
      # deployment test) can probe `/_matrix/mau/live` from the host.
      - "127.0.0.1:${WHATSAPP_APPSERVICE_PORT:-29318}:29318"
    healthcheck:
      # The appservice listener's unauthenticated liveness probe. Readiness
      # (`/_matrix/mau/ready`) additionally waits for the network connection,
      # which without a login never comes — so liveness is the right probe
      # for a bridge nobody has logged in to yet.
      test: ["CMD", "curl", "-fsS", "http://localhost:29318/_matrix/mau/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # As above, for Signal. See the WhatsApp pair for the commentary.
  bridge-signal-registration:
    profiles: [bridges]
    image: dock.mau.dev/mautrix/signal:v26.09
    user: "0:0"
    environment:
      BRIDGE_NETWORK: signal
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}
      MATRIX_INTERNAL_URL: ${MATRIX_INTERNAL_URL:-http://synapse:8008}
      # The single owner whose login this bridge accepts. Defaults to
      # GATEWAY_OWNER: it is the same human, and one deployment has one
      # (ADR 0011).
      MATRIX_OWNER_USER_ID: ${MATRIX_OWNER_USER_ID:-${GATEWAY_OWNER:-}}
      BRIDGE_AS_TOKEN: ${SIGNAL_AS_TOKEN:-}
      BRIDGE_HS_TOKEN: ${SIGNAL_HS_TOKEN:-}
      BRIDGE_PROVISIONING_SECRET: ${SIGNAL_PROVISIONING_SECRET:-}
      BRIDGE_STATUS_ENDPOINT: ${SIGNAL_STATUS_ENDPOINT:-}
      BRIDGE_UID: "1337"
      BRIDGE_GID: "1337"
    volumes:
      - ../../bridges/generate-registration.sh:/opt/twalk/generate-registration.sh:ro
      - ../../bridges/mautrix-signal/config.yaml:/opt/twalk/config.yaml:ro
      - signal-data:/data
      - bridge-registrations:/registrations
    entrypoint: ["/usr/bin/env", "bash", "/opt/twalk/generate-registration.sh"]

  bridge-signal:
    profiles: [bridges]
    image: dock.mau.dev/mautrix/signal:v26.09
    depends_on:
      synapse:
        condition: service_healthy
      bridge-signal-registration:
        condition: service_completed_successfully
    volumes:
      - signal-data:/data
    ports:
      - "127.0.0.1:${SIGNAL_APPSERVICE_PORT:-29328}:29328"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29328/_matrix/mau/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  synapse-data:
  nats-data:
  sensor-data:
  gateway-data:
  # Written by the bridges' registration one-shots, read by Synapse. Shared
  # on purpose: it is the one piece of state a bridge and the homeserver must
  # agree on, and it is created empty whether or not the profile is on.
  bridge-registrations:
  # Each bridge's config, database and — after a human has scanned the QR
  # code — its session on the external network. Deleting one of these is
  # logging that account out.
  whatsapp-data:
  signal-data:
