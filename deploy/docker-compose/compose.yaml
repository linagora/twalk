# Twalk reference deployment: Synapse (the Matrix hub), NATS JetStream (the
# bus), the Sensor and the Companion Gateway, wired together with named
# volumes and configured only through the environment file — copy
# .env.example to .env and edit it first.
#
#   docker compose up -d --wait
#
# The provision one-shot creates the Sensor account on the way up;
# ./provision.sh remains for ad-hoc account creation from the host.
#
# The mautrix bridges are off by default, behind the `bridges` compose
# profile: an operator who does not want them pulls no bridge image, runs no
# bridge container and sets no bridge variable. Enabling them is two steps and
# not one, because installing an appservice registration means editing the
# homeserver's configuration and restarting it — there is no runtime API for
# it (see ../README.md and ./provision-bridges.sh):
#
#   ./provision-bridges.sh                      # registrations, then Synapse
#   docker compose --profile bridges up -d --wait
#
# Running only the second is a loud failure, not a subtle one — ../README.md
# names both shapes it takes.
#
# Hermes joins this stack as of issue #158, and with it the one service that
# holds the host's Docker socket — read ADR 0023 and the `hermes` service
# below before running this on a host you share. The other planes join as
# they land (see the repository roadmap).

name: twalk

services:
  # One-shot: renders /data/homeserver.yaml from the Jinja2 template in
  # ./synapse with the environment below (the image's `migrate_config` mode),
  # generates the signing key on first start and fixes /data ownership, then
  # exits. Re-rendered whenever the environment changes.
  synapse-config:
    image: matrixdotorg/synapse:v1.161.0
    command: ["migrate_config"]
    environment:
      # start.py requires these two even though the template reads the
      # MATRIX_* variables directly.
      SYNAPSE_SERVER_NAME: ${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}
      SYNAPSE_REPORT_STATS: "no"
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:?set MATRIX_REGISTRATION_SHARED_SECRET in .env}
      MATRIX_MACAROON_SECRET: ${MATRIX_MACAROON_SECRET:?set MATRIX_MACAROON_SECRET in .env}
      MATRIX_FORM_SECRET: ${MATRIX_FORM_SECRET:?set MATRIX_FORM_SECRET in .env}
      # start.py persists these two to key files in /data when unset; the
      # rendered config uses the MATRIX_* values, so pin them to the same
      # secrets to avoid generating unused files.
      SYNAPSE_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:?set MATRIX_REGISTRATION_SHARED_SECRET in .env}
      SYNAPSE_MACAROON_SECRET_KEY: ${MATRIX_MACAROON_SECRET:?set MATRIX_MACAROON_SECRET in .env}
      # Comma-separated appservice registration paths, as Synapse reads them
      # from the bridge-registrations volume. Empty (the default): no
      # `app_service_config_files` at all, which is what the stack without
      # bridges needs — Synapse refuses to start on a path that does not
      # exist yet, so this stays the operator's explicit opt-in and
      # ./provision-bridges.sh checks it before generating anything.
      MATRIX_APPSERVICE_REGISTRATIONS: ${MATRIX_APPSERVICE_REGISTRATIONS:-}
    volumes:
      - ./synapse/homeserver.yaml:/conf/homeserver.yaml:ro
      - synapse-data:/data

  synapse:
    image: matrixdotorg/synapse:v1.161.0
    depends_on:
      synapse-config:
        condition: service_completed_successfully
    volumes:
      # Database, media store and signing key.
      - synapse-data:/data
      # The bridges' appservice registrations, generated at provisioning
      # time (./provision-bridges.sh) and read here — read-only, because the
      # homeserver is their consumer and never their author. Mounted
      # unconditionally: an empty volume costs nothing, and the paths inside
      # it only reach Synapse's configuration through
      # MATRIX_APPSERVICE_REGISTRATIONS above.
      - bridge-registrations:/registrations:ro
    ports:
      # Localhost only by default: in production the client API is fronted
      # by the operator's TLS reverse proxy on the same host (which is what
      # x_forwarded in the Synapse config is for).
      - "127.0.0.1:${MATRIX_HTTP_PORT:-8008}:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  # One-shot: creates the Sensor account once Synapse is healthy, so a fresh
  # `docker compose up` is the whole setup — no manual provisioning step.
  # Open registration stays off; this authenticates with the registration
  # shared secret from the rendered config, like provision.sh does from the
  # host. Idempotent: an existing account is skipped.
  provision:
    image: matrixdotorg/synapse:v1.161.0
    depends_on:
      synapse:
        condition: service_healthy
    environment:
      SENSOR_USER_ID: ${SENSOR_USER_ID:?set SENSOR_USER_ID in .env}
      SENSOR_PASSWORD: ${SENSOR_PASSWORD:?set SENSOR_PASSWORD in .env}
    volumes:
      # Read-only: register_new_matrix_user only reads the registration
      # shared secret from the rendered config.
      - synapse-data:/data:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        localpart="$${SENSOR_USER_ID#@}"; localpart="$${localpart%%:*}"
        output=$$(register_new_matrix_user -u "$$localpart" -p "$$SENSOR_PASSWORD" --no-admin \
          -c /data/homeserver.yaml http://synapse:8008 2>&1) \
          && { echo "provisioned $$localpart"; exit 0; }
        echo "$$output" >&2
        echo "$$output" | grep -qi "already" && exit 0
        exit 1
    # Tolerate early boot races the same way the sensor does.
    restart: on-failure

  nats:
    image: nats:2
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    ports:
      # Localhost only: the bus has no authentication in this reference
      # stack, so it must not be reachable from the network. Host-side
      # consumers (Hermes, replay tools) use this port.
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
    # No healthcheck: the nats image ships no shell, wget or CLI to probe
    # with. The sensor service below retries its way in instead.
    restart: unless-stopped

  sensor:
    build:
      # The repository root: the sensor crate declares the shared test
      # harness (tests/harness/) as a dev dependency, and cargo needs every
      # path dependency present to resolve the graph at all. See
      # sensor.Dockerfile.
      context: ../..
      # Resolved from the build context.
      dockerfile: deploy/docker-compose/sensor.Dockerfile
    # Name the local build is tagged with, and the image the service runs.
    # Overridable (issue #38) so that several stacks built from different
    # checkouts on one Docker daemon — the deployment test in parallel
    # worktrees — never overwrite each other's image.
    image: ${TWALK_SENSOR_IMAGE:-twalk/sensor:local}
    depends_on:
      synapse:
        condition: service_healthy
      nats:
        condition: service_started
      # Starts only once its account exists; the restart policy below stays
      # as the safety net for a skipped or failed provisioning.
      provision:
        condition: service_completed_successfully
    environment:
      SENSOR_HOMESERVER: http://synapse:8008
      SENSOR_NATS_URL: nats://nats:4222
      SENSOR_USER_ID: ${SENSOR_USER_ID:?set SENSOR_USER_ID in .env}
      SENSOR_PASSWORD: ${SENSOR_PASSWORD:?set SENSOR_PASSWORD in .env}
      SENSOR_ALLOWED_INVITERS: ${SENSOR_ALLOWED_INVITERS:?set SENSOR_ALLOWED_INVITERS in .env}
      SENSOR_STATE_DIR: ${SENSOR_STATE_DIR:-/data}
      SENSOR_LOG_LEVEL: ${SENSOR_LOG_LEVEL:-info}
      SENSOR_METRICS_LISTEN: ${SENSOR_METRICS_LISTEN:-}
      SENSOR_RECOVERY_KEY: ${SENSOR_RECOVERY_KEY:-}
      # The operator, and the identities their own messages arrive under
      # (ticket #109, ADR 0018). SENSOR_OWNER is the same human as
      # GATEWAY_OWNER and defaults to it; SENSOR_OWNER_IDENTITIES is the set
      # of that account's network ghosts, which nothing can derive today —
      # see the .env.example entry, which explains how to read them off the
      # rooms. Both empty: the user's own messages keep going out as a
      # contact's, which is the behaviour #109 is about.
      SENSOR_OWNER: ${SENSOR_OWNER:-${GATEWAY_OWNER:-}}
      SENSOR_OWNER_IDENTITIES: ${SENSOR_OWNER_IDENTITIES:-}
      # The bridges' own bots (issue #152, ADR 0026): the accounts that are
      # not people, so nothing is published about them. The same ids as in
      # SENSOR_ALLOWED_INVITERS minus your own account — deliberately named a
      # second time rather than derived from that list, which also names you:
      # see the .env.example entry. Empty: a bridge bot is published as a
      # contact, which on the reference deployment was 95% of the bus.
      SENSOR_BRIDGE_BOTS: ${SENSOR_BRIDGE_BOTS:-}
      # The consent snapshot (ticket #51, ADR 0010): where the Sensor reads
      # the whole consent state at startup, and the token it reads it with.
      # Both derive from the one secret GATEWAY_SERVICE_TOKEN, so setting that
      # lights up both halves of the same hand-off: the Gateway serves the
      # snapshot, and the Sensor reads it from this stack's own Gateway.
      # Leaving it empty leaves these empty too — no snapshot, a cold consent
      # cache on every restart (issue #16), and inbound events unaffected.
      # Override either one to read a snapshot from a Gateway that is not
      # this stack's; setting one without the other is refused on startup.
      SENSOR_GATEWAY_URL: ${SENSOR_GATEWAY_URL:-${GATEWAY_SERVICE_TOKEN:+http://companion-gateway:8080}}
      SENSOR_GATEWAY_SERVICE_TOKEN: ${SENSOR_GATEWAY_SERVICE_TOKEN:-${GATEWAY_SERVICE_TOKEN:-}}
    volumes:
      # Session, sync token and crypto store: a restart resumes the sync
      # instead of re-syncing (and re-emitting) recent traffic.
      - sensor-data:/data
    # The sensor exits on an unreachable homeserver or bus and on a missing
    # account (should provisioning have been skipped or failed); compose
    # restarts it until both are there.
    restart: unless-stopped

  # The Companion Gateway: the origin that serves the Companion PWA, the
  # user's session, and the single writer of consent state (ADR 0006). It
  # needs no homeserver to come up — it talks to one only while somebody is
  # signing in — and it publishes its consent decisions on the bus below.
  companion-gateway:
    build:
      # The repository root, for the same reason as the sensor's: cargo needs
      # every path dependency present to resolve the graph at all. See
      # companion-gateway.Dockerfile.
      context: ../..
      dockerfile: deploy/docker-compose/companion-gateway.Dockerfile
    # Name the local build is tagged with, and the image the service runs.
    # Overridable (issue #38) so that several stacks built from different
    # checkouts on one Docker daemon never overwrite each other's image.
    image: ${TWALK_GATEWAY_IMAGE:-twalk/companion-gateway:local}
    depends_on:
      # Where the consent outbox publishes each committed decision. Not a
      # hard dependency inside the Gateway — a decision commits and waits in
      # the outbox while the bus is away — but in this stack the bus is right
      # there, so there is no reason to start without it.
      nats:
        condition: service_started
    environment:
      # The container-internal origin; the host-side port is published below.
      GATEWAY_LISTEN: 0.0.0.0:8080
      # The Companion's static files. The image ships them at /srv/companion;
      # point this elsewhere (with a matching volume below) to serve your own
      # build.
      GATEWAY_STATIC_DIR: ${GATEWAY_STATIC_DIR:-/srv/companion}
      # The Companion's SPA fallback file: what a client-side route (a deep
      # link reloaded cold) is served with.
      GATEWAY_FALLBACK_FILE: ${GATEWAY_FALLBACK_FILE:-200.html}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      # The single human this deployment serves, as a full Matrix ID
      # (ADR 0011). Sign-in verifies the Companion's OpenID token at the
      # homeserver and refuses every other identity. Left empty, nobody can
      # sign in: the origin still serves the Companion and every /api
      # endpoint answers 503 — deliberately, so that an operator who has not
      # set it yet keeps the page that can say so.
      GATEWAY_OWNER: ${GATEWAY_OWNER:-}
      # Where the Gateway verifies an OpenID token: the homeserver's own
      # federation API, on this compose network. Pinned rather than resolved
      # from the server name — one deployment, one homeserver.
      GATEWAY_HOMESERVER_FEDERATION_URL: ${GATEWAY_HOMESERVER_FEDERATION_URL:-http://synapse:8008}
      # Where the Gateway keeps its SQLite stores: the session store and the
      # consent decision journal. Must stay on the gateway-data volume
      # mounted below — the journal is the record of truth for consent.
      GATEWAY_STATE_DIR: ${GATEWAY_STATE_DIR:-/data}
      # The bus the consent outbox publishes each committed decision on.
      # Fixed to this stack's own bus, as the Sensor's URL is: a deployment
      # has one bus, and pointing the Gateway at another would split the
      # audit trail from the events the Sensor labels by.
      GATEWAY_NATS_URL: nats://nats:4222
      # Session lifetimes in seconds; empty means the Gateway's defaults
      # (15 minutes for a device token, 30 days for its refresh token).
      GATEWAY_DEVICE_TOKEN_TTL: ${GATEWAY_DEVICE_TOKEN_TTL:-}
      GATEWAY_REFRESH_TOKEN_TTL: ${GATEWAY_REFRESH_TOKEN_TTL:-}
      # The homeserver's client API, where the Gateway relays account
      # registration and sends the Sensor's invitations. Empty: the federation
      # URL above is used, which is the same host and port in this stack.
      GATEWAY_HOMESERVER_URL: ${GATEWAY_HOMESERVER_URL:-}
      # Bootstrap (ticket #53). Left empty, both halves are off and their
      # endpoints answer 503 naming the variable that would open them.
      #
      # The registration shared secret lets the Gateway create ONE account —
      # the owner's above, once — while Synapse's own open registration stays
      # off. Set it to the same value as MATRIX_REGISTRATION_SHARED_SECRET to
      # let the Companion's screen 2 create that account; leave it empty if you
      # provisioned the account yourself with ./provision.sh.
      GATEWAY_REGISTRATION_SHARED_SECRET: ${GATEWAY_REGISTRATION_SHARED_SECRET:-}
      # Who the Gateway invites into the rooms the user selects: the Sensor's
      # own account, the same value as SENSOR_USER_ID. The Sensor's account
      # stays provisioned by the provision one-shot above — this is who to
      # invite, never how to create it.
      GATEWAY_SENSOR_USER_ID: ${GATEWAY_SENSOR_USER_ID:-${SENSOR_USER_ID:-}}
      # The bridge login facade (ticket #55): which bridges the Companion can
      # connect a network through, and how the Gateway reaches each one's
      # provisioning API. Listed by bridge_id; each id then names its own
      # three variables below.
      #
      # This is deliberately not tied to the `bridges` compose profile:
      # compose has no way to vary a variable by profile, so an operator who
      # runs no bridge leaves GATEWAY_BRIDGES empty and GET /api/bridges
      # answers an empty list. Set it when you enable the profile. All three
      # bridges of the reference deployment:
      #
      #   GATEWAY_BRIDGES=mautrix-whatsapp,mautrix-signal,mautrix-gmessages
      GATEWAY_BRIDGES: ${GATEWAY_BRIDGES:-}
      # Where the bridge's provisioning API is: its own appservice listener
      # on this compose network, not the homeserver. No published port is
      # needed — the Gateway is inside the network.
      GATEWAY_BRIDGE_MAUTRIX_WHATSAPP_URL: ${GATEWAY_BRIDGE_MAUTRIX_WHATSAPP_URL:-http://bridge-whatsapp:29318}
      # The same value as that bridge's provisioning.shared_secret, which
      # ./provision-bridges.sh renders from WHATSAPP_PROVISIONING_SECRET. It
      # starts and destroys that bridge's logins: the most powerful thing
      # this facade holds, which is why the browser never talks to a bridge
      # directly (docs/architecture/security-model.md).
      GATEWAY_BRIDGE_MAUTRIX_WHATSAPP_PROVISIONING_SECRET: ${WHATSAPP_PROVISIONING_SECRET:-}
      # The network the user experiences, which is what the Companion labels
      # the screen with — never the bridge's name (CONTEXT.md).
      GATEWAY_BRIDGE_MAUTRIX_WHATSAPP_NETWORK: whatsapp
      # Bridge status (ticket #56): the same value as that bridge's own
      # appservice.as_token, which is what it authenticates its status pushes
      # with. The Gateway holds it to VERIFY those pushes and for nothing
      # else — it never acts as the appservice. Unset, that bridge's webhook
      # is refused rather than trusted: every container on this network can
      # reach the Gateway's port, so the network is not a credential
      # (docs/architecture/security-model.md).
      GATEWAY_BRIDGE_MAUTRIX_WHATSAPP_AS_TOKEN: ${WHATSAPP_AS_TOKEN:-}
      # The account the portal register acts as (issue #171). An appservice
      # token used with no ?user_id= acts as the registration's
      # sender_localpart, and provision-bridges.sh generates that localpart —
      # a random string joined to no rooms. The account that is in every
      # portal is the bridge's BOT, whose localpart is its own
      # `bridge.bot_username` (bridges/mautrix-whatsapp/config.yaml). Read
      # from configuration and never assembled from the bridge id, for the
      # reason ADR 0018 refused to derive the owner's ghosts — a bridge that
      # renames its bot would otherwise leave the register reading nothing and
      # reporting zero.
      GATEWAY_BRIDGE_MAUTRIX_WHATSAPP_BOT_USER_ID: ${WHATSAPP_BOT_USER_ID:-@whatsappbot:${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}}
      GATEWAY_BRIDGE_MAUTRIX_SIGNAL_URL: ${GATEWAY_BRIDGE_MAUTRIX_SIGNAL_URL:-http://bridge-signal:29328}
      GATEWAY_BRIDGE_MAUTRIX_SIGNAL_PROVISIONING_SECRET: ${SIGNAL_PROVISIONING_SECRET:-}
      GATEWAY_BRIDGE_MAUTRIX_SIGNAL_NETWORK: signal
      GATEWAY_BRIDGE_MAUTRIX_SIGNAL_AS_TOKEN: ${SIGNAL_AS_TOKEN:-}
      GATEWAY_BRIDGE_MAUTRIX_SIGNAL_BOT_USER_ID: ${SIGNAL_BOT_USER_ID:-@signalbot:${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}}
      GATEWAY_BRIDGE_MAUTRIX_GMESSAGES_URL: ${GATEWAY_BRIDGE_MAUTRIX_GMESSAGES_URL:-http://bridge-gmessages:29336}
      GATEWAY_BRIDGE_MAUTRIX_GMESSAGES_PROVISIONING_SECRET: ${GMESSAGES_PROVISIONING_SECRET:-}
      # `sms`, and this is the line where that matters most. The bridge is
      # `mautrix-gmessages`, the network the user experiences is SMS, and the
      # two are not the same word (ADR 0005): `gmessages` is not in the
      # contract's network enum and the Gateway refuses to start if it is
      # named here. A v0.2 deployment running the sovereign SMS Companion
      # instead sets the same value for a different bridge.
      GATEWAY_BRIDGE_MAUTRIX_GMESSAGES_NETWORK: sms
      GATEWAY_BRIDGE_MAUTRIX_GMESSAGES_AS_TOKEN: ${GMESSAGES_AS_TOKEN:-}
      GATEWAY_BRIDGE_MAUTRIX_GMESSAGES_BOT_USER_ID: ${GMESSAGES_BOT_USER_ID:-@gmessagesbot:${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}}
      # The bridge_id each one's events carry, and the segment of its status
      # webhook's URL. Left to the Gateway's own default here — the instance
      # id with `mautrix-` stripped under a `bridge-` prefix — which is
      # exactly what WHATSAPP_STATUS_ENDPOINT, SIGNAL_STATUS_ENDPOINT and
      # GMESSAGES_STATUS_ENDPOINT in .env.example already point at. Set
      # GATEWAY_BRIDGE_<ID>_STATUS_ID only to name one yourself, and change
      # the endpoint with it: it is the identity third parties read off the
      # bus, so it must not move.
      # The consent snapshot (ticket #50): the token a consumer reads
      # GET /api/consent/snapshot with — the whole consent state and the bus
      # sequence it reflects, which is how a component with a cold cache
      # recovers consent (ADR 0010). Its caller is a service and not a
      # browser, so it is a token in configuration and not a sign-in. Empty:
      # the endpoint answers 503 and nothing else changes.
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-}
      # The largest snapshot this Gateway serves, in (subject, network)
      # entries; empty means its default. There is no pagination — a state
      # over the cap is an error naming this variable, never a truncation.
      GATEWAY_CONSENT_SNAPSHOT_MAX_ENTRIES: ${GATEWAY_CONSENT_SNAPSHOT_MAX_ENTRIES:-}
      # The pending-contact projection (ticket #54): the durable JetStream
      # consumer the Gateway reads inbound.message.received through, to know
      # who has written and is still waiting for a decision. Empty means its
      # default, which is right for a deployment with one Gateway — set it
      # only if you run a second Gateway against this bus, where sharing one
      # durable name would split the stream between them.
      GATEWAY_INBOUND_CONSUMER: ${GATEWAY_INBOUND_CONSUMER:-}
      # Approvals (ticket #24): how many stream positions back the Gateway
      # searches for the suggestion an approval names, and for the message
      # that suggestion answers. Empty means its default. The bound is
      # visible in the answer — a suggestion the search did not reach is
      # refused as "out of reach" and never as "not found" — so widening
      # this is a choice about how far back a reply can be approved from,
      # not about whether the answer is honest.
      GATEWAY_APPROVAL_LOOKUP_WINDOW: ${GATEWAY_APPROVAL_LOOKUP_WINDOW:-}
      # How often the portal register is re-read in the background (issue
      # #105). Empty: 300 seconds; 0 turns it off. It decides only how fresh
      # the /metrics counts of observed and unobserved conversations are —
      # GET /api/portals always reads the homeserver there and then.
      GATEWAY_PORTAL_REFRESH_SECONDS: ${GATEWAY_PORTAL_REFRESH_SECONDS:-}
      # The model and the language (ticket #98): the LLM endpoint credential
      # as a FILE, which wins over anything the Companion writes, so a
      # production stack can lock the credential down while the model name
      # still comes from the browser (ADR 0015). The same host path the
      # hermes service is given below — one file, one entry in .env, and no
      # way for the two to drift. Set only when the operator gave one; the
      # container's side of that mount is fixed.
      GATEWAY_LLM_API_KEY_FILE: ${HERMES_LLM_API_KEY_FILE:+/run/secrets/llm-api-key}
    volumes:
      # The device list and the session tokens' digests — a restart keeps the
      # user signed in on every device they signed in on — the consent
      # decision journal, which outlives every container by design, and the
      # model and language settings.
      - gateway-data:/data
      # The endpoint credential the operator supplied as a file, read-only.
      # Unset, /dev/null is mounted here and GATEWAY_LLM_API_KEY_FILE stays
      # empty, so nothing reads it. Docker creates a *directory* for a path
      # that does not exist, so a typo shows up as a Gateway that refuses to
      # start naming the variable rather than as a credential silently
      # falling back to the browser's.
      - ${HERMES_LLM_API_KEY_FILE:-/dev/null}:/run/secrets/llm-api-key:ro
    #   # Serve a Companion build from the host instead of the image's.
    #   - ${GATEWAY_STATIC_SOURCE:-./companion}:/srv/companion:ro
    # No depends_on the homeserver: the Gateway talks to it only while
    # somebody is signing in, and the Companion's origin must come up even
    # when the homeserver is down — that is when the user most needs a page
    # that explains itself.
    ports:
      # Localhost only by default: in production the Companion's origin is
      # fronted by the operator's TLS reverse proxy on the same host. The
      # health and metrics endpoints live on this same origin — block
      # /metrics at the proxy if it should not be public.
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # --- Hermes: the runtime, and the personas it hosts ----------------------
  #
  # One-shot: builds the `assistant` persona's image and exits. A persona
  # ships as a container image (ADR 0008) and the runtime starts that image
  # itself, so nothing in this file ever *runs* a persona — but the image has
  # to exist before the runtime reaches for it, and `docker compose up` only
  # builds images for services it starts. Hence a service that exists to be
  # built: its entrypoint is overridden to `/bin/true`, it exits 0, and
  # `hermes` below waits for that completion.
  #
  # It is also the answer to "where does the persona's image come from?"
  # (#158): from this repository, built on the operator's own host, like the
  # Sensor's and the Gateway's. Nothing is published to a registry yet.
  persona-assistant-image:
    build:
      # The repository root: a persona image carries the SDK from
      # sdk/python/. See hermes/personas/assistant/Dockerfile.
      context: ../..
      dockerfile: hermes/personas/assistant/Dockerfile
    # Overridable per stack (issue #38), like every other locally built image
    # here, and it must match the image named in HERMES_PERSONAS below.
    image: ${TWALK_PERSONA_IMAGE:-twalk/persona-assistant:local}
    entrypoint: ["/bin/true"]

  # The Hermes runtime: it reads the persona list from its environment,
  # starts one process per persona, follows `consent.state.changed` to learn
  # which personas the user activated, and moves each persona's durable
  # consumer rather than its process when that changes (ADR 0013).
  #
  # Two things about this service are deliberate and neither is free.
  #
  # **It holds the host's Docker socket.** A persona is an image and the
  # runtime spawns a process, so something has to turn one into the other;
  # in this deployment that is `run-persona` inside this container, talking
  # to the daemon that runs this stack. Mounting that socket into a service
  # is giving that service root on the host — not a smaller thing because
  # the service is ours. ADR 0023 argues the alternatives and records what an
  # operator is accepting; docs/architecture/security-model.md carries it as
  # a residual risk. The personas themselves are handed no socket: the
  # runtime constructs their environment (ADR 0015) and the wrapper mounts
  # nothing into them.
  #
  # **It runs in the host's network namespace,** and so do the persona
  # containers it starts. The runtime hands a persona one bus URL — the one
  # it uses itself — so the runtime and its personas must see the bus at the
  # same address; and a persona must be able to reach the operator's LLM,
  # which on the reference deployment is a proxy published on the host's
  # loopback (`http://127.0.0.1:4000/v1`). A container on this stack's
  # network dials itself for the second, and this host firewalls the docker
  # bridge, so loopback is the only address that serves both. The bus is
  # reached through its published port below, which is why NATS_PORT appears
  # in the default URL.
  #
  # What that costs, stated: this container can reach every service bound to
  # the host's loopback, which on a typical Twalk host includes Synapse and
  # the Gateway. An operator whose LLM is reachable at a routable address —
  # a proxy on another machine, or one listening on a docker network — can
  # put Hermes back on this stack's network instead: replace `network_mode`
  # with the default, set HERMES_NATS_URL to nats://nats:4222, and add
  # `--network <this stack's network>` to each persona's argv in
  # HERMES_PERSONAS.
  hermes:
    build:
      # The repository root, for the same reason as the Sensor's and the
      # Gateway's. See hermes.Dockerfile.
      context: ../..
      dockerfile: deploy/docker-compose/hermes.Dockerfile
    image: ${TWALK_HERMES_IMAGE:-twalk/hermes:local}
    depends_on:
      nats:
        condition: service_started
      # The image the runtime is configured to start has to exist first: a
      # persona whose image is not there is announced as failed to start,
      # which would be an honest report of a deployment problem this stack
      # can simply not have.
      persona-assistant-image:
        condition: service_completed_successfully
    network_mode: host
    # tini as pid 1: a persona's wrapper leaves short-lived `docker` clients
    # behind, and the runtime reaps only the children it spawned.
    init: true
    volumes:
      # The socket above. Overridable so that an operator can hand this
      # service a *rootless* daemon's socket
      # (e.g. /run/user/1000/docker.sock) instead of the system one, which
      # narrows the grant from root to that user's own account — the one
      # mitigation ADR 0023 names that costs nothing.
      - ${HERMES_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # The endpoint credential as a file, which wins over the variable so a
      # production stack can lock it down (ADR 0015). The operator names a
      # path on the host; the container always sees the same path. Unset,
      # /dev/null is mounted here and HERMES_LLM_API_KEY_FILE stays empty, so
      # nothing reads it. Docker creates a *directory* for a path that does
      # not exist, so a typo here shows up as "is a directory" rather than as
      # a missing file.
      - ${HERMES_LLM_API_KEY_FILE:-/dev/null}:/run/secrets/llm-api-key:ro
    environment:
      # The personas this deployment hosts: a JSON array of an id and an
      # argv, exactly as the runtime reads it. The argv is
      # `run-persona <container name> <image>`, the wrapper this image ships
      # — so adding a third-party persona is one more object in this array
      # and no change to this file, which is what ADR 0008 asks for.
      # Empty: the runtime hosts nothing and says so (see hermes-entrypoint.sh).
      HERMES_PERSONAS: ${HERMES_PERSONAS:-}
      # The authority of every hosted persona's `source` URI
      # (hermes://<domain>/personas/<persona id>). One deployment, one
      # domain: the homeserver's, unless the operator says otherwise.
      HERMES_DOMAIN: ${HERMES_DOMAIN:-${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}}
      # This stack's bus, through the port it publishes on loopback: the
      # runtime is in the host's network namespace and so are its personas,
      # and both are handed this one URL.
      HERMES_NATS_URL: ${HERMES_NATS_URL:-nats://127.0.0.1:${NATS_PORT:-4222}}
      # The LLM the operator named. There is no default, for either of them
      # (ADR 0015): left empty, this service starts, states the refusal in
      # its log and hosts nothing, rather than sending the user's messages to
      # a model nobody chose.
      HERMES_LLM_BASE_URL: ${HERMES_LLM_BASE_URL:-}
      HERMES_LLM_MODEL: ${HERMES_LLM_MODEL:-}
      HERMES_LLM_API_KEY: ${HERMES_LLM_API_KEY:-}
      # Set only when the operator gave a host path above; the container's
      # side of that mount is fixed.
      HERMES_LLM_API_KEY_FILE: ${HERMES_LLM_API_KEY_FILE:+/run/secrets/llm-api-key}
      # Provider parameters passed to the persona untouched, and the
      # endpoint's timeout. A parameter set to null removes a field the
      # request would otherwise carry, which is how a provider that rejects
      # one is made to work (ADR 0015).
      HERMES_LLM_PARAMS: ${HERMES_LLM_PARAMS:-}
      HERMES_LLM_TIMEOUT_SECONDS: ${HERMES_LLM_TIMEOUT_SECONDS:-}
      # How long a suggestion stays approvable (#22). Empty leaves the SDK's
      # own default of an hour; the Gateway refuses an expired one.
      HERMES_SUGGESTION_TTL_SECONDS: ${HERMES_SUGGESTION_TTL_SECONDS:-}
      # The user's own language, injected into each persona as
      # TWALK_USER_LANGUAGE (#164): what a persona falls back to when it
      # cannot tell what language the message it is answering was written in,
      # and nothing else (ADR 0016). Empty means the user has set none — the
      # personas then answer in each message's own language and say so in
      # their logs.
      HERMES_USER_LANGUAGE: ${HERMES_USER_LANGUAGE:-}
      HERMES_LOG_LEVEL: ${HERMES_LOG_LEVEL:-info}
      # The personas' own level: debugging a persona should not make the
      # supervisor noisy too.
      HERMES_PERSONA_LOG_LEVEL: ${HERMES_PERSONA_LOG_LEVEL:-info}
      # Names of the runtime's own variables a persona's argv may inherit.
      # Empty means the runtime's default, PATH — which is what
      # `run-persona` needs to find the docker client, and nothing more. Add
      # DOCKER_HOST here when you point HERMES_DOCKER_SOCKET at a rootless
      # daemon on a non-default path: it configures the client, and a
      # persona never sees it (run-persona strips it).
      HERMES_PERSONA_ENV_PASSTHROUGH: ${HERMES_PERSONA_ENV_PASSTHROUGH:-}
      # The bus stream and subject prefix, `twalk` in every deployment;
      # empty leaves the runtime's defaults.
      HERMES_BUS_STREAM: ${HERMES_BUS_STREAM:-}
      HERMES_BUS_SUBJECT_PREFIX: ${HERMES_BUS_SUBJECT_PREFIX:-}
      # Supervision: how long a run must last to count as one, how many
      # failed starts in a row are announced as a failure, and the backoff
      # between restarts. Empty leaves the runtime's defaults (10s, 3,
      # 1s → 60s, 10s), which are right for a deployment and too slow for
      # anything watching a persona fail on purpose.
      HERMES_PERSONA_HEALTHY_AFTER_MS: ${HERMES_PERSONA_HEALTHY_AFTER_MS:-}
      HERMES_PERSONA_START_FAILURES: ${HERMES_PERSONA_START_FAILURES:-}
      HERMES_RESTART_BACKOFF_BASE_MS: ${HERMES_RESTART_BACKOFF_BASE_MS:-}
      HERMES_RESTART_BACKOFF_MAX_MS: ${HERMES_RESTART_BACKOFF_MAX_MS:-}
      HERMES_SHUTDOWN_GRACE_MS: ${HERMES_SHUTDOWN_GRACE_MS:-}
    # The runtime exits on unreadable configuration and on a bus it cannot
    # reach at startup; compose brings it back, as it does the Sensor.
    restart: unless-stopped

  # --- Bridges: mautrix-whatsapp, mautrix-signal and mautrix-gmessages -----
  #
  # All six services below carry `profiles: [bridges]`, so a plain
  # `docker compose up` ignores them entirely. Their variables all have empty
  # defaults for the same reason: compose interpolates the whole file whatever
  # the active profiles are, and a stack without bridges must not be asked for
  # a bridge token — not a WhatsApp one, not a Signal one, not a gmessages
  # one. The missing-value errors therefore come from
  # ../../bridges/generate-registration.sh, which can say what is missing and
  # why, rather than from interpolation.
  #
  # Image versions are pinned. A bridge holds the user's account on an
  # external network (docs/architecture/security-model.md): its version is not
  # something a `docker compose pull` should change underneath a working
  # login.
  #
  # `BRIDGE_MAUTRIX_ID` below is mautrix's own name for each bridge, which
  # selects its binary, its appservice id and its registration's filename.
  # `gmessages` is one of those names and is never a network value (ADR 0005):
  # the network that bridge serves is `sms`, which appears once, as
  # GATEWAY_BRIDGE_MAUTRIX_GMESSAGES_NETWORK above.

  # One-shot: renders the bridge's configuration from ../../bridges/
  # mautrix-whatsapp/config.yaml plus the environment, and generates the
  # appservice registration into the shared bridge-registrations volume. Runs
  # as root because it writes that shared volume and then hands the bridge's
  # own data directory back to the unprivileged bridge user.
  #
  # It is also what ./provision-bridges.sh runs, before Synapse ever starts —
  # generating a registration needs no homeserver, which is precisely why this
  # is provisioning-time work and not something the running bridge can do.
  bridge-whatsapp-registration:
    profiles: [bridges]
    image: dock.mau.dev/mautrix/whatsapp:v26.09
    user: "0:0"
    environment:
      BRIDGE_MAUTRIX_ID: whatsapp
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}
      MATRIX_INTERNAL_URL: ${MATRIX_INTERNAL_URL:-http://synapse:8008}
      # The single owner whose login this bridge accepts. Defaults to
      # GATEWAY_OWNER: it is the same human, and one deployment has one
      # (ADR 0011).
      MATRIX_OWNER_USER_ID: ${MATRIX_OWNER_USER_ID:-${GATEWAY_OWNER:-}}
      BRIDGE_AS_TOKEN: ${WHATSAPP_AS_TOKEN:-}
      BRIDGE_HS_TOKEN: ${WHATSAPP_HS_TOKEN:-}
      BRIDGE_PROVISIONING_SECRET: ${WHATSAPP_PROVISIONING_SECRET:-}
      BRIDGE_STATUS_ENDPOINT: ${WHATSAPP_STATUS_ENDPOINT:-}
      # The image's own UID/GID, under names bash does not already own.
      BRIDGE_UID: "1337"
      BRIDGE_GID: "1337"
    volumes:
      - ../../bridges/generate-registration.sh:/opt/twalk/generate-registration.sh:ro
      - ../../bridges/mautrix-whatsapp/config.yaml:/opt/twalk/config.yaml:ro
      - whatsapp-data:/data
      - bridge-registrations:/registrations
    entrypoint: ["/usr/bin/env", "bash", "/opt/twalk/generate-registration.sh"]

  bridge-whatsapp:
    profiles: [bridges]
    image: dock.mau.dev/mautrix/whatsapp:v26.09
    depends_on:
      # The bridge asserts its own registration against the homeserver on
      # startup and exits if Synapse does not know its as_token — so Synapse
      # has to be up, and its configuration has to name the registration
      # already. That second half is ./provision-bridges.sh's job and cannot
      # be a compose dependency; a bridge left crash-looping with
      # "appservice not found" in its log is the symptom of skipping it.
      synapse:
        condition: service_healthy
      bridge-whatsapp-registration:
        condition: service_completed_successfully
    volumes:
      # Rendered config, SQLite database, and the WhatsApp session once a
      # human has scanned the QR code.
      - whatsapp-data:/data
    ports:
      # Localhost only: this port carries the appservice listener, and with
      # it the provisioning API (`/_matrix/provision/v3/*`) whose bearer
      # token starts and destroys logins. Inside the stack the Companion
      # Gateway reaches it as http://bridge-whatsapp:29318 with no published
      # port at all; this mapping exists so that an operator (and the
      # deployment test) can probe `/_matrix/mau/live` from the host.
      - "127.0.0.1:${WHATSAPP_APPSERVICE_PORT:-29318}:29318"
    healthcheck:
      # The appservice listener's unauthenticated liveness probe. Readiness
      # (`/_matrix/mau/ready`) additionally waits for the network connection,
      # which without a login never comes — so liveness is the right probe
      # for a bridge nobody has logged in to yet.
      test: ["CMD", "curl", "-fsS", "http://localhost:29318/_matrix/mau/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # As above, for Signal. See the WhatsApp pair for the commentary.
  bridge-signal-registration:
    profiles: [bridges]
    image: dock.mau.dev/mautrix/signal:v26.09
    user: "0:0"
    environment:
      BRIDGE_MAUTRIX_ID: signal
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}
      MATRIX_INTERNAL_URL: ${MATRIX_INTERNAL_URL:-http://synapse:8008}
      # The single owner whose login this bridge accepts. Defaults to
      # GATEWAY_OWNER: it is the same human, and one deployment has one
      # (ADR 0011).
      MATRIX_OWNER_USER_ID: ${MATRIX_OWNER_USER_ID:-${GATEWAY_OWNER:-}}
      BRIDGE_AS_TOKEN: ${SIGNAL_AS_TOKEN:-}
      BRIDGE_HS_TOKEN: ${SIGNAL_HS_TOKEN:-}
      BRIDGE_PROVISIONING_SECRET: ${SIGNAL_PROVISIONING_SECRET:-}
      BRIDGE_STATUS_ENDPOINT: ${SIGNAL_STATUS_ENDPOINT:-}
      BRIDGE_UID: "1337"
      BRIDGE_GID: "1337"
    volumes:
      - ../../bridges/generate-registration.sh:/opt/twalk/generate-registration.sh:ro
      - ../../bridges/mautrix-signal/config.yaml:/opt/twalk/config.yaml:ro
      - signal-data:/data
      - bridge-registrations:/registrations
    entrypoint: ["/usr/bin/env", "bash", "/opt/twalk/generate-registration.sh"]

  bridge-signal:
    profiles: [bridges]
    image: dock.mau.dev/mautrix/signal:v26.09
    depends_on:
      synapse:
        condition: service_healthy
      bridge-signal-registration:
        condition: service_completed_successfully
    volumes:
      - signal-data:/data
    ports:
      - "127.0.0.1:${SIGNAL_APPSERVICE_PORT:-29328}:29328"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29328/_matrix/mau/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # As above, for SMS through Google Messages. See the WhatsApp pair for the
  # commentary; two things are particular to this one.
  #
  # Its bridge id is `mautrix-gmessages` and its network is `sms` (ADR 0005).
  # `gmessages` below is only ever mautrix's own name for the bridge — the
  # binary, the appservice id, the registration file, the compose service and
  # the variables that carry this bridge's secrets. Nothing here makes it a
  # network: SMS is `sms` whether it transits Google Messages Web or, in v0.2,
  # the sovereign SMS Companion.
  #
  # And its login is a Google account's: seven session cookies the user copies
  # out of a private browsing window, then an emoji match on the phone
  # (#57, the Companion's screen 3c). No script does that, and this deployment
  # does not try — the stack's job ends at a bridge that is up, healthy and
  # waiting for a human. And what this path costs is not softened by being
  # deployed: SMS transits Google Messages Web, it needs a Google account, it
  # is unavailable to an iOS-only user, and mautrix documents no lifetime for
  # those cookies, so nothing here promises a re-login cadence.
  bridge-gmessages-registration:
    profiles: [bridges]
    image: dock.mau.dev/mautrix/gmessages:v26.09
    user: "0:0"
    environment:
      BRIDGE_MAUTRIX_ID: gmessages
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:?set MATRIX_DOMAIN in .env}
      MATRIX_INTERNAL_URL: ${MATRIX_INTERNAL_URL:-http://synapse:8008}
      # The single owner whose login this bridge accepts. Defaults to
      # GATEWAY_OWNER: it is the same human, and one deployment has one
      # (ADR 0011).
      MATRIX_OWNER_USER_ID: ${MATRIX_OWNER_USER_ID:-${GATEWAY_OWNER:-}}
      BRIDGE_AS_TOKEN: ${GMESSAGES_AS_TOKEN:-}
      BRIDGE_HS_TOKEN: ${GMESSAGES_HS_TOKEN:-}
      BRIDGE_PROVISIONING_SECRET: ${GMESSAGES_PROVISIONING_SECRET:-}
      BRIDGE_STATUS_ENDPOINT: ${GMESSAGES_STATUS_ENDPOINT:-}
      BRIDGE_UID: "1337"
      BRIDGE_GID: "1337"
    volumes:
      - ../../bridges/generate-registration.sh:/opt/twalk/generate-registration.sh:ro
      - ../../bridges/mautrix-gmessages/config.yaml:/opt/twalk/config.yaml:ro
      - gmessages-data:/data
      - bridge-registrations:/registrations
    entrypoint: ["/usr/bin/env", "bash", "/opt/twalk/generate-registration.sh"]

  bridge-gmessages:
    profiles: [bridges]
    image: dock.mau.dev/mautrix/gmessages:v26.09
    depends_on:
      synapse:
        condition: service_healthy
      bridge-gmessages-registration:
        condition: service_completed_successfully
    volumes:
      - gmessages-data:/data
    ports:
      # 29336 is mautrix-gmessages' own default appservice port, as 29318 and
      # 29328 are WhatsApp's and Signal's. Localhost only, for the same
      # reason: this port carries the provisioning API.
      - "127.0.0.1:${GMESSAGES_APPSERVICE_PORT:-29336}:29336"
    healthcheck:
      # Liveness, not readiness — and here the distinction is at its
      # sharpest: readiness waits for the Google Messages connection, which
      # cannot exist until a human has pasted their cookies, so a
      # ready-probing bridge would never be healthy on a fresh deployment.
      test: ["CMD", "curl", "-fsS", "http://localhost:29336/_matrix/mau/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  synapse-data:
  nats-data:
  sensor-data:
  gateway-data:
  # Written by the bridges' registration one-shots, read by Synapse. Shared
  # on purpose: it is the one piece of state a bridge and the homeserver must
  # agree on, and it is created empty whether or not the profile is on.
  bridge-registrations:
  # Each bridge's config, database and — once a human has finished its login,
  # by scanning a QR code or by pasting their Google cookies — its session on
  # the external network. Deleting one of these is logging that account out.
  whatsapp-data:
  signal-data:
  # The Google Messages session lives here once a human has pasted their
  # cookies. Deleting this volume is unpairing this bridge from their phone.
  gmessages-data:
